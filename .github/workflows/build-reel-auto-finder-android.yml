name: Build Reel Finder Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "instagram-reel-auto-finder-android/**"
      - ".github/workflows/build-reel-auto-finder-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: instagram-reel-auto-finder-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reel-auto-finder-debug-apk
          path: instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

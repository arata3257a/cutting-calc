<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>販売管理システム 復旧版</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:#f5f7fb;color:#1f2937;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center;box-shadow:0 4px 18px #0001}.err{color:#b91c1c;font-size:13px;margin-top:10px}</style></head><body><div class="box"><b>販売管理システム 復旧版を起動しています</b><div id="e" class="err"></div></div><script>(async()=>{try{const files=['v34_chunk_1.txt','v34_chunk_2.txt','v34_chunk_3.txt','v34_chunk_4.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?recovery=20260904i',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('DecompressionStream unsupported');const ds=new DecompressionStream('gzip');let text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const patch=(a,b)=>{if(!text.includes(a))throw new Error('patch target missing');text=text.replace(a,b)};patch('<div><label>メール</label><input id="sMail"></div>','<div><label>メール</label><input id="sMail"></div><div><label>インボイス登録番号</label><input id="sInvoiceNo" placeholder="T1234567890123"></div>');patch("db.suppliers.push({id:uid('S'),name:val('sName'),person:val('sPerson'),tel:val('sTel'),mail:val('sMail'),closing:val('sClosing'),transferDay:val('sTransferDay'),paymentMonth:val('sPaymentMonth'),terms:val('sTerms'),memo:val('sMemo')});","db.suppliers.push({id:uid('S'),name:val('sName'),person:val('sPerson'),tel:val('sTel'),mail:val('sMail'),invoiceNo:val('sInvoiceNo'),closing:val('sClosing'),transferDay:val('sTransferDay'),paymentMonth:val('sPaymentMonth'),terms:val('sTerms'),memo:val('sMemo')});");patch("['sName','sPerson','sTel','sMail','sClosing','sTransferDay','sPaymentMonth','sTerms','sMemo']","['sName','sPerson','sTel','sMail','sInvoiceNo','sClosing','sTransferDay','sPaymentMonth','sTerms','sMemo']");patch("<td>${esc(x.contact||'')}</td>\n    <td>${esc(x.tel||'')}</td>\n    <td>${esc(x.email||'')}</td>\n    <td>${esc(x.closing||'')}</td>\n    <td>${esc(x.transferDay||'')}</td>\n    <td>${esc(x.paymentMonth||'')}</td>\n    <td>${esc(x.paymentCondition||'')}</td>","<td>${esc(x.person||'')}</td>\n    <td>${esc(x.tel||'')}</td>\n    <td>${esc(x.mail||'')}</td>\n    <td>${esc(x.invoiceNo||'')}</td>\n    <td>${esc(x.closing||'')}</td>\n    <td>${esc(x.transferDay||'')}</td>\n    <td>${esc(x.paymentMonth||'')}</td>\n    <td>${esc(x.terms||'')}</td>");patch("table(['会社名','担当者','TEL','メール','締日','振込日','支払月','支払条件','操作'],rows);","table(['会社名','担当者','TEL','メール','インボイス登録番号','締日','振込日','支払月','支払条件','操作'],rows);");patch("const mail=prompt('メール',x.mail||''); if(mail===null) return;","const mail=prompt('メール',x.mail||''); if(mail===null) return;\n  const invoiceNo=prompt('インボイス登録番号',x.invoiceNo||''); if(invoiceNo===null) return;");patch("Object.assign(x,{name:name.trim(),person:person.trim(),tel:tel.trim(),mail:mail.trim(),memo:memo.trim(),closing,transferDay,paymentMonth,terms});","Object.assign(x,{name:name.trim(),person:person.trim(),tel:tel.trim(),mail:mail.trim(),invoiceNo:invoiceNo.trim(),memo:memo.trim(),closing,transferDay,paymentMonth,terms});");const auto=`<script>(function(){
function nval(o,preferred,fallback){if(!o)return null;const keys=Object.keys(o);const pick=list=>{for(const k of keys){const lk=String(k).toLowerCase();if(list.some(r=>r.test(lk))&&o[k]!==''&&o[k]!=null&&Number.isFinite(Number(o[k])))return Number(o[k]);}return null};const a=pick(preferred);return a!=null?a:pick(fallback||[])}
function around(el){let x=el,s='';for(let i=0;i<5&&x;i++,x=x.parentElement)s+=' '+(x.textContent||'').slice(0,500);return s}
function productFor(el){if(!window.db||!Array.isArray(db.products))return null;const v=String(el.value||'').trim();const opt=el.tagName==='SELECT'&&el.selectedIndex>=0?String(el.options[el.selectedIndex].textContent||'').trim():'';return db.products.find(p=>String(p.id||'')===v||String(p.code||'')===v||String(p.name||'')===v||(p.name&&opt.includes(String(p.name))))||null}
function fieldText(f){const p=f.closest('label,td,th,div');return ((p&&p.textContent)||'')+' '+(f.name||'')+' '+(f.id||'')+' '+(f.placeholder||'')}
function setField(root,regex,value,except){if(value==null)return;const fs=[...root.querySelectorAll('input,select')];const f=fs.find(x=>x!==except&&regex.test(fieldText(x)));if(!f)return;f.value=String(value);f.dispatchEvent(new Event('input',{bubbles:true}));f.dispatchEvent(new Event('change',{bubbles:true}))}
function apply(el){const t=around(el);if(!/(製品|商品|品名)/.test(t))return;const p=productFor(el);if(!p)return;let root=el.closest('tr,.item-row,.line-item,form,.card,.panel,section');if(!root)root=el.parentElement&&el.parentElement.parentElement;if(!root)root=document;const isOrder=/発注|仕入/.test(t)&&!/売上/.test(t);const qty=nval(p,[/^(qty|quantity|defaultqty|stockqty|stock)$/,/数量/],[/qty/,/quantity/,/stock/]);const price=isOrder?nval(p,[/buyprice/,/purchaseprice/,/costprice/,/^cost$/,/仕入/],[/unitprice/,/^price$/,/price/]):nval(p,[/sellprice/,/saleprice/,/salesprice/,/販売/],[/unitprice/,/^price$/,/price/]);setField(root,/(数量|個数|qty|quantity)/i,qty,el);setField(root,/(単価|unit.?price|price)/i,price,el)}

})();<\/script>`;text=text.replace('</body>',auto+'</body>');document.open();document.write(text);document.close()}catch(err){document.getElementById('e').textContent='起動に失敗しました: '+err.message;console.error(err)}})();</script></body></html>

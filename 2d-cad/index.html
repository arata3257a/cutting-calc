<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>2D CAD かんたん作図</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div>
      <strong>2D CAD かんたん作図</strong>
      <small>v0.1</small>
    </div>
    <div class="header-actions">
      <button id="undoBtn">↶ 戻る</button>
      <button id="saveBtn">保存</button>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="作図ツール">
      <button class="tool active" data-tool="line">／<span>直線</span></button>
      <button class="tool" data-tool="rect">□<span>四角</span></button>
      <button class="tool" data-tool="circle">○<span>円</span></button>
    </section>

    <section class="canvas-wrap">
      <canvas id="cadCanvas"></canvas>
      <div id="hint">始点をタップしてください</div>
    </section>

    <section class="bottom-actions">
      <button id="sampleBtn">サンプル</button>
      <button id="exportBtn">JSON出力</button>
      <button id="clearBtn" class="danger">全消去</button>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>

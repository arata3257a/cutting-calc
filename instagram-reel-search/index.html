<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>リール発掘検索</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Instagram Reel Finder</p>
      <h1>リール発掘検索</h1>
      <p class="lead">入力した瞬間に判定。検索日は今日で固定します。</p>
    </header>

    <section class="must-panel">
      <div><strong>10,000人以上</strong><span>フォロワー</span></div>
      <div><strong>180投稿未満</strong><span>総投稿数</span></div>
      <div><strong>7日以内</strong><span>投稿からの日数</span></div>
    </section>

    <section class="panel finder-panel">
      <div class="search-date-row">
        <span>検索日</span>
        <strong id="searchDateLabel">今日</strong>
      </div>

      <div class="hashtag-row">
        <input id="hashtags" type="text" placeholder="#加工" autocomplete="off">
        <button id="searchBtn" class="secondary">Instagramで検索</button>
      </div>
      <div id="searchLinks" class="search-links"></div>

      <hr>

      <div class="section-head">
        <div>
          <h2>候補をチェック</h2>
          <p class="sub">上から3つ入れるだけ。自動で足切りします。</p>
        </div>
        <span id="shareBadge" class="badge" hidden>共有URL受取済み</span>
      </div>

      <label class="full">リールURL <small>（共有なら自動入力）</small>
        <input id="reelUrl" type="url" inputmode="url" placeholder="https://www.instagram.com/reel/...">
      </label>

      <div class="two-col">
        <label>フォロワー数
          <input id="followers" type="text" inputmode="decimal" placeholder="1.2万 でもOK">
        </label>
        <label>総投稿数
          <input id="posts" type="text" inputmode="numeric" placeholder="例 86">
        </label>
      </div>

      <div class="days-block">
        <div class="label-row">
          <strong>投稿日は何日前？</strong>
          <span id="daySelectedText">未選択</span>
        </div>
        <div id="dayButtons" class="day-buttons">
          <button type="button" data-day="0">今日</button>
          <button type="button" data-day="1">1日前</button>
          <button type="button" data-day="2">2日前</button>
          <button type="button" data-day="3">3日前</button>
          <button type="button" data-day="4">4日前</button>
          <button type="button" data-day="5">5日前</button>
          <button type="button" data-day="6">6日前</button>
          <button type="button" data-day="7">7日前</button>
          <button type="button" data-day="8" class="old-day">8日以上</button>
        </div>
      </div>

      <div id="mustResult" class="live-result waiting">
        フォロワー・投稿数・投稿日を入れると自動判定します
      </div>

      <div id="viewsStage" class="views-stage" hidden>
        <div class="pass-head">必須3条件クリア 🎯</div>
        <label class="full">このリールの再生数
          <input id="views" type="text" inputmode="decimal" placeholder="4.5万 でもOK">
        </label>
        <div id="ratioLive" class="ratio-live">再生数を入力してください</div>
        <button id="saveBtn" class="primary" hidden>この投稿を保存</button>
      </div>

      <button id="nextBtn" class="ghost">次の候補</button>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>条件クリア一覧</h2>
          <p class="sub">3条件＋再生数3倍を通った投稿だけ残ります。</p>
        </div>
        <span id="passedCount" class="badge">0件</span>
      </div>

      <div id="passedList" class="results">
        <p class="empty">まだ条件一致した投稿はありません。</p>
      </div>

      <details class="tools">
        <summary>保存データの操作</summary>
        <div class="footer-actions">
          <button id="exportBtn" class="secondary">CSV保存</button>
          <button id="clearPassedBtn" class="danger-ghost">すべて消去</button>
        </div>
      </details>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>2D CAD かんたん作図</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=123">
</head>
<body>
  <header>
    <div class="brand">
      <strong>2D CAD かんたん作図</strong>
      <small>v1.23 / mm</small>
    </div>
    <div class="header-actions">
      <button id="undoBtn" title="戻る">↶</button>
      <button id="redoBtn" title="進む">↷</button>
      <button id="saveBtn" class="primary">保存</button>
    </div>
  </header>

  <main>
    <section class="workspace">
      <div class="canvas-wrap">
        <canvas id="cadCanvas"></canvas>

        <div id="dimensionModeDock" class="dimension-mode hidden">
          <div class="dimension-mode-title">寸法方向を選択</div>
          <div class="dimension-mode-buttons">
            <button id="dimHorizontalBtn" class="dim-mode-btn active" type="button">↔<span>水平寸法</span></button>
            <button id="dimVerticalBtn" class="dim-mode-btn" type="button">↕<span>垂直寸法</span></button>
          </div>
          <select id="dimensionModeSelect" class="visually-hidden" aria-label="寸法方向">
            <option value="horizontal" selected>水平</option>
            <option value="vertical">垂直</option>
          </select>
        </div>

        <div id="hint">図形をタップして選択できます</div>
      </div>

      <nav class="edit-toolbar" aria-label="編集ツール">
        <button id="layerBtn" class="tool edit-tool" title="レイヤー">▱<span>レイヤー</span></button>
        <button class="tool edit-tool" data-tool="trim">✂<span>トリム</span></button>
        <button class="tool edit-tool" data-tool="offset">⇆<span>オフセット</span></button>
        <button class="tool edit-tool" data-tool="chamfer">◩<span>面取り</span></button>
        <button class="tool edit-tool" data-tool="fillet">⌜<span>R</span></button>
        <button class="tool edit-tool" data-tool="copy">⧉<span>コピー</span></button>
        <button class="tool edit-tool" data-tool="mirror">↔<span>ミラー</span></button>
        <button class="tool edit-tool" data-tool="rotate">↻<span>回転</span></button>
        <button class="tool edit-tool" data-tool="dimension">↕<span>寸法</span></button>
        <button class="tool edit-tool" data-tool="multi">✥<span>移動</span></button>
        <button id="deleteToolBtn" class="tool edit-tool delete-tool">🗑<span>削除</span></button>
      </nav>

      <nav class="draw-toolbar" aria-label="作図ツール">
        <button class="tool active" data-tool="select">↖<span>選択</span></button>
        <button class="tool" data-tool="line">／<span>直線</span></button>
        <button class="tool" data-tool="parallel">∥<span>平行線</span></button>
        <button class="tool" data-tool="point">•<span>点</span></button>
        <button class="tool" data-tool="circle">○<span>円</span></button>
        <button class="tool" data-tool="slot">▭<span>長穴</span></button>
        <button class="tool" data-tool="arc">⌒<span>円弧</span></button>
      </nav>

      <aside id="layerPanel" class="panel compact-panel hidden">
        <div class="panel-title">
          <strong>レイヤー</strong>
          <button id="closeLayerBtn" class="icon-btn">×</button>
        </div>
        <div class="fields">
          <div class="field">
            <label for="layerSelect">現在のレイヤー</label>
            <select id="layerSelect">
              <option value="0">0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="field">
            <label>表示</label>
            <button id="layerVisibleBtn">👁 表示中</button>
          </div>
        </div>
      </aside>

      <aside id="quickPanel" class="panel hidden">
        <div class="panel-title">
          <strong id="quickTitle">数値で作図</strong>
          <button id="closeQuickBtn" class="icon-btn">×</button>
        </div>
        <div id="quickFields" class="fields"></div>
        <button id="createByValueBtn" class="primary wide">この寸法で作成</button>
      </aside>

      <aside id="propertyPanel" class="panel hidden">
        <div class="panel-title">
          <strong>選択した図形</strong>
          <button id="closePropertyBtn" class="icon-btn">×</button>
        </div>
        <div id="propertyFields" class="fields"></div>
        <div class="row">
          <button id="applyPropertyBtn" class="primary">寸法を更新</button>
          <button id="deleteSelectedBtn" class="danger">削除</button>
        </div>
      </aside>

      <aside id="sheetPanel" class="panel hidden">
        <div class="panel-title">
          <strong>図枠・タイトル</strong>
          <button id="closeSheetBtn" class="icon-btn">×</button>
        </div>
        <div class="fields">
          <div class="field"><label for="sheetTitle">図面名</label><input id="sheetTitle" value="加工図"></div>
          <div class="field"><label for="sheetNo">図番</label><input id="sheetNo" value=""></div>
          <div class="field"><label for="sheetScale">尺度</label><input id="sheetScale" value="1:1"></div>
          <div class="field"><label for="sheetName">作成者</label><input id="sheetName" value=""></div>
        </div>
        <button id="saveSheetBtn" class="primary wide">図枠設定を保存</button>
      </aside>
    </section>

    <section class="bottom-actions">
      <button id="newBtn">新規</button>
      <button id="sampleBtn">サンプル</button>
      <button id="importBtn">JSON読込</button>
      <button id="dxfImportBtn">DXF読込</button>
      <button id="exportBtn">JSON出力</button>
      <button id="dxfBtn">DXF出力</button>
      <button id="svgBtn">SVG出力</button>
      <button id="sheetBtn">図枠</button>
      <button id="printBtn">印刷/PDF</button>
      <input id="importInput" type="file" accept=".json,application/json" hidden>
      <input id="dxfInput" type="file" accept=".dxf,text/plain" hidden>
    </section>
  </main>

  <script src="./app.js?v=123"></script>
</body>
</html>

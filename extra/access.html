<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EXTRA Access</title><style>body{margin:0;background:#17191c;color:#f2f2f2;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,420px);background:#23262b;border:1px solid #555;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0008}.logo{font-size:30px;font-weight:900;font-style:italic;letter-spacing:2px;margin-bottom:8px}.logo .x{color:#d4af37}.sub{color:#bfc3c8;font-size:14px;margin-bottom:22px}input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #666;background:#111317;color:#fff;font-size:18px;text-align:center;letter-spacing:4px}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#171717;font-weight:900;font-size:16px}.msg{margin-top:14px;font-size:13px;color:#c8c8c8;line-height:1.6}.used{padding:14px;border:1px solid #8a6f22;background:#2d291d;border-radius:10px;color:#ffe28a}</style></head><body><main class="box"><div class="logo">E<span class="x">X</span>TRA</div><div class="sub">加工条件かんたん計算</div><div id="used" class="used" hidden>この端末では利用済みです。再ダウンロードはできません。</div><div id="form"><input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="パスワード"><button id="go">EXTRAを開く</button><div class="msg">認証後、この端末でEXTRAを利用できます。ダウンロードまたは共有を1回実行すると利用権限は終了します。</div></div></main><script>(()=>{const PASS='1018',A='extra-access-granted-v1',U='extra-download-used-v1';const used=()=>{try{return localStorage.getItem(U)==='1'}catch{return false}};if(used()){document.getElementById('used').hidden=false;document.getElementById('form').hidden=true;return}function go(){const v=document.getElementById('pw').value;if(v!==PASS){alert('パスワードが違います。');return}try{localStorage.setItem(A,'1')}catch{}location.replace('./')}document.getElementById('go').onclick=go;document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')go()})})();</script></body></html>

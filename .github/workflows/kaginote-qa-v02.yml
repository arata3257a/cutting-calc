name: KagiNote Native v0.2 Unlock Recovery Test APK
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaginote-qa-v02.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Extract baseline source
        run: |
          xz -dc kaginote-native-build-src.zip.xz > /tmp/kaginote-source.zip
          unzip -q /tmp/kaginote-source.zip -d kaginote-native
      - name: Apply audited v0.2 regression patch (side-by-side QA app)
        run: |
          printf '%s' '' | base64 -d | xz -dc > /tmp/kaginote-qa-patch.py
          python3 /tmp/kaginote-qa-patch.py kaginote-native
          grep -q "applicationId 'jp.kaginote.secure.qa02'" kaginote-native/app/build.gradle
          grep -q 'private boolean unlockPending = false' kaginote-native/app/src/main/java/jp/kaginote/secure/MainActivity.java
          grep -q 'BIOMETRIC_ERROR_LOCKOUT_PERMANENT' kaginote-native/app/src/main/java/jp/kaginote/secure/MainActivity.java
      - name: Cryptography and manifest checks
        run: |
          mkdir -p /tmp/kaginote-test-classes
          javac -encoding UTF-8 -d /tmp/kaginote-test-classes kaginote-native/app/src/main/java/jp/kaginote/secure/VaultCrypto.java kaginote-native/tests/CryptoSelfTest.java
          java -cp /tmp/kaginote-test-classes CryptoSelfTest
          python3 kaginote-native/tests/security_check.py
      - name: Build Android QA APK
        working-directory: kaginote-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify signature, package and no network permissions
        run: |
          APK=kaginote-native/app/build/outputs/apk/debug/app-debug.apk
          SDK_BIN="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK_BIN/apksigner" verify --verbose "$APK"
          "$SDK_BIN/aapt" dump badging "$APK" | head -6
          "$SDK_BIN/aapt" dump badging "$APK" | grep -q "package: name='jp.kaginote.secure.qa02'"
          "$SDK_BIN/aapt" dump permissions "$APK" | tee /tmp/kaginote-permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/kaginote-permissions.txt; then echo "Security failure: INTERNET permission"; exit 1; fi
          sha256sum "$APK"
      - name: Archive installable QA APK (not for real passwords)
        uses: actions/upload-artifact@v4
        with:
          name: KagiNote-Android-v0.2-QA-Debug-SideBySide-NotForSecrets
          path: kaginote-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

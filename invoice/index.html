<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>かんたん請求書メーカー</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#1f4e79;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text)}
.wrap{max-width:1040px;margin:0 auto;padding:20px}h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr;gap:16px}.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}textarea{min-height:150px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row3{display:grid;grid-template-columns:2fr .8fr 1.2fr;gap:10px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.hint{font-size:12px;color:var(--muted);margin-top:8px}.error{color:#b91c1c;font-size:13px;margin-top:8px}
.section-title{font-weight:800;font-size:14px;margin:4px 0 10px}.saved{font-size:12px;color:#047857;margin-top:8px}.mini{padding:8px 10px;font-size:13px}.format-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:14px}
.item-row{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-top:10px}.item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.item-title{font-weight:800;font-size:13px}
.quote{background:#fff;border-radius:12px;padding:28px;min-height:420px;border:1px solid #e5e7eb}.quote h2{text-align:center;margin:0 0 18px;font-size:28px;letter-spacing:.15em}
.company{text-align:right;font-size:11px;line-height:1.55;margin-top:14px}.company strong{font-size:12px}.meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;font-size:14px}.meta .right{text-align:right}
table{width:100%;border-collapse:collapse;margin-top:16px;table-layout:fixed}th,td{border:1px solid #9ca3af;padding:10px;font-size:14px;word-break:break-word}th{background:#f3f4f6;text-align:center}td.num{text-align:right}.totals{margin-left:auto;margin-top:18px;width:min(420px,100%)}.totals .line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #d1d5db}.totals .grand{font-size:20px;font-weight:800;border-bottom:3px double #111827}
@media(min-width:850px){.grid{grid-template-columns:440px 1fr}}@media(max-width:600px){.row,.row3{grid-template-columns:1fr}.quote{padding:16px}.meta{flex-direction:column}.meta .right{text-align:left}.company{text-align:right}}
@media print{body{background:#fff}.no-print{display:none!important}.wrap{max-width:none;padding:0}.grid{display:block}.card{box-shadow:none;padding:0}.quote{border:0;padding:18mm;min-height:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print"><h1>かんたん請求書メーカー</h1><div class="sub">文章から複数明細を読み取り、そのまま請求書に整形します。</div></div>
  <div class="grid">
    <div class="card no-print">
      <label>元の文章</label>
      <textarea id="source">株式会社サンプル様
A5052 アルミプレート 10個
単価2500円
追加工費 1式 5000円
消費税10%</textarea>
      <div class="actions"><button class="primary" onclick="parseText()">文章から読み取る</button><button class="secondary" onclick="clearAll()">クリア</button></div>
      <div class="hint">「品名 10個」＋次行「単価2500円」や「追加工費 1式 5000円」に対応</div><div id="msg" class="error"></div>
      <hr style="border:0;border-top:1px solid #e5e7eb;margin:18px 0">

      <div class="format-box">
        <div class="section-title">フォーマット設定</div>
        <label>自社名</label><input id="company" placeholder="例：株式会社〇〇製作所" oninput="saveFormat();render()">
        <div class="row" style="margin-top:10px">
          <div><label>電話番号（任意）</label><input id="companyTel" placeholder="03-0000-0000" oninput="saveFormat();render()"></div>
          <div><label>担当者（任意）</label><input id="companyPerson" placeholder="山田" oninput="saveFormat();render()"></div>
        </div>
        <div id="formatSaved" class="saved">会社情報はこの端末に自動保存されます</div>
        <hr style="border:0;border-top:1px solid #e5e7eb;margin:16px 0">
        <div class="section-title" style="font-size:15px">お振込先設定</div>
        <div class="row">
          <div><label>登録口座</label><select id="bankProfileSelect" onchange="selectBankProfile(this.value)"></select></div>
          <div><label>登録名</label><input id="bankProfileName" placeholder="例：メイン口座"></div>
        </div>
        <div class="actions">
          <button class="primary mini" onclick="saveBankProfile()">口座を登録 / 更新</button>
          <button class="secondary mini" onclick="newBankProfile()">新規口座</button>
          <button class="danger mini" onclick="deleteBankProfile()">選択口座を削除</button>
        </div>
        <label style="margin-top:12px">銀行名</label><input id="bankName" placeholder="例：〇〇銀行" oninput="render()">
        <div class="row" style="margin-top:10px">
          <div><label>支店名</label><input id="bankBranch" placeholder="例：本店営業部" oninput="render()"></div>
          <div><label>口座種別</label><select id="bankType" onchange="render()"><option value="普通">普通</option><option value="当座">当座</option></select></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label>口座番号</label><input id="bankNumber" inputmode="numeric" placeholder="例：1234567" oninput="render()"></div>
          <div><label>口座名義</label><input id="bankHolder" placeholder="例：カ）サンプル" oninput="render()"></div>
        </div>
        <div id="bankSaved" class="saved">登録した口座はこの端末に保存されます</div>
        <div class="actions">
          <button class="secondary mini" onclick="exportSettings()">全設定をバックアップ</button>
          <button class="secondary mini" onclick="document.getElementById('settingsImport').click()">設定を復元</button>
          <input id="settingsImport" type="file" accept="application/json,.json" style="display:none" onchange="importSettings(this)">
        </div>
      </div>

      <div class="row"><div><label>宛名</label><input id="customer" oninput="render()"></div><div><label>請求番号</label><input id="quoteNo" oninput="render()"></div></div>
      <div class="row" style="margin-top:10px"><div><label>発行日</label><input id="date" type="date" oninput="render()"></div><div><label>お振込予定日</label><input id="valid" type="date" oninput="render()"></div></div>

      <div class="section-title" style="margin-top:16px">明細</div>
      <div id="itemsEditor"></div>
      <button class="secondary" style="margin-top:10px" onclick="addItem()">＋ 明細を追加</button>

      <div class="row" style="margin-top:14px"><div><label>消費税</label><select id="tax" onchange="render()"><option value="10">10%</option><option value="8">8%</option><option value="0">非課税</option></select></div><div><label>備考</label><input id="note" oninput="render()"></div></div>
      <div class="actions"><button class="primary" onclick="window.print()">印刷 / PDF保存</button></div>
    </div>

    <div class="card"><div id="quote" class="quote"></div></div>
  </div>
</div>
<script>
const bankFields = ['bankName','bankBranch','bankType','bankNumber','bankHolder'];
let bankProfiles=[];
let selectedBankId='';
function bankProfileData(){const d={};bankFields.forEach(id=>d[id]=document.getElementById(id)?.value||'');return d;}
function renderBankBlock(){
  const g=id=>document.getElementById(id)?.value?.trim()||'';
  const name=g('bankName'), branch=g('bankBranch'), type=g('bankType'), number=g('bankNumber'), holder=g('bankHolder');
  if(!name && !branch && !number && !holder) return '';
  const branchDisplay = branch ? (/(支店|本店|営業部|出張所)$/.test(branch) ? branch : branch + '支店') : '';
  return `<div style="margin-top:28px;padding-top:14px;border-top:1px solid #cfd4da;font-size:13px;line-height:1.8"><div style="font-weight:700;margin-bottom:4px">お振込先</div><div>${esc([name,branchDisplay].filter(Boolean).join('　'))}</div><div>${esc([type,number,holder].filter(Boolean).join('　'))}</div></div>`;
}
function saveBankStore(){localStorage.setItem('invoiceBankProfilesV2',JSON.stringify({profiles:bankProfiles,selectedBankId}));}
function loadBankProfiles(){
  try{const d=JSON.parse(localStorage.getItem('invoiceBankProfilesV2')||'{}');bankProfiles=Array.isArray(d.profiles)?d.profiles:[];selectedBankId=d.selectedBankId||'';}catch(e){bankProfiles=[];}
  if(!bankProfiles.length){
    try{const old=JSON.parse(localStorage.getItem('invoiceBankSettings')||'{}');if(old.bankName||old.bankNumber){const id=String(Date.now());bankProfiles=[{id,name:'メイン口座',...old}];selectedBankId=id;saveBankStore();}}catch(e){}
  }
  refreshBankSelect();if(selectedBankId)selectBankProfile(selectedBankId);else newBankProfile(false);
}
function refreshBankSelect(){
  const sel=document.getElementById('bankProfileSelect');if(!sel)return;
  sel.innerHTML='<option value="">-- 口座を選択 --</option>'+bankProfiles.map(p=>`<option value="${esc(p.id)}" ${p.id===selectedBankId?'selected':''}>${esc(p.name||'名称なし')}</option>`).join('');
}
function selectBankProfile(id){
  selectedBankId=id||'';const p=bankProfiles.find(x=>x.id===selectedBankId);if(!p){newBankProfile(false);return;}
  document.getElementById('bankProfileName').value=p.name||'';bankFields.forEach(k=>document.getElementById(k).value=p[k]||'');saveBankStore();refreshBankSelect();render();
}
function newBankProfile(doRender=true){selectedBankId='';document.getElementById('bankProfileName').value='';bankFields.forEach(k=>document.getElementById(k).value=k==='bankType'?'普通':'');refreshBankSelect();if(doRender)render();}
function saveBankProfile(){
  const name=document.getElementById('bankProfileName').value.trim()||document.getElementById('bankName').value.trim()||'振込口座';
  const data=bankProfileData();if(!data.bankName&&!data.bankNumber){alert('銀行名または口座番号を入力してください。');return;}
  if(selectedBankId){const i=bankProfiles.findIndex(x=>x.id===selectedBankId);if(i>=0)bankProfiles[i]={...bankProfiles[i],name,...data};}
  else{selectedBankId=Date.now().toString(36)+Math.random().toString(36).slice(2,6);bankProfiles.push({id:selectedBankId,name,...data});}
  saveBankStore();refreshBankSelect();document.getElementById('bankProfileName').value=name;const el=document.getElementById('bankSaved');if(el)el.textContent=`「${name}」を保存しました`;render();
}
function deleteBankProfile(){
  if(!selectedBankId){alert('削除する登録口座を選択してください。');return;}const p=bankProfiles.find(x=>x.id===selectedBankId);if(!confirm(`「${p?.name||'登録口座'}」を削除しますか？`))return;
  bankProfiles=bankProfiles.filter(x=>x.id!==selectedBankId);selectedBankId=bankProfiles[0]?.id||'';saveBankStore();refreshBankSelect();if(selectedBankId)selectBankProfile(selectedBankId);else newBankProfile();
}
function exportSettings(){
  const company={company:document.getElementById('company').value,tel:document.getElementById('companyTel').value,person:document.getElementById('companyPerson').value};
  const data={type:'invoice-settings',version:2,company,bankProfiles,selectedBankId};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='請求書_設定バックアップ.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importSettings(input){
  const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const c=d.company||{};document.getElementById('company').value=c.company||'';document.getElementById('companyTel').value=c.tel||'';document.getElementById('companyPerson').value=c.person||'';bankProfiles=Array.isArray(d.bankProfiles)?d.bankProfiles:[];selectedBankId=d.selectedBankId||bankProfiles[0]?.id||'';saveFormat();saveBankStore();refreshBankSelect();if(selectedBankId)selectBankProfile(selectedBankId);else newBankProfile();render();alert('設定を復元しました。');}catch(e){alert('設定ファイルを読み込めませんでした。');}input.value='';};r.readAsText(f);
}

let items=[];
function yen(n){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(Number(n)||0));}
function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(v){if(!v)return'';const d=new Date(v+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;}
function genNo(){const d=new Date();return `Q${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(Math.floor(Math.random()*900)+100)}`;}
function saveFormat(){const d={company:document.getElementById('company').value,tel:document.getElementById('companyTel').value,person:document.getElementById('companyPerson').value};localStorage.setItem('invoiceFormatV2',JSON.stringify(d));const el=document.getElementById('formatSaved');if(el){el.textContent='会社情報を保存しました';clearTimeout(window._invSavedTimer);window._invSavedTimer=setTimeout(()=>el.textContent='会社情報はこの端末に自動保存されます',1200);}}
function loadFormat(){let d={};try{d=JSON.parse(localStorage.getItem('invoiceFormatV2')||'{}')}catch(e){};document.getElementById('company').value=d.company??localStorage.getItem('estimate_company')??'';document.getElementById('companyTel').value=d.tel??localStorage.getItem('estimate_tel')??'';document.getElementById('companyPerson').value=d.person??localStorage.getItem('estimate_person')??'';}
function normalize(s){return s.replace(/，/g,',').replace(/￥/g,'円').replace(/[　\t]+/g,' ').trim();}
function parseMoney(s){const m=String(s).match(/([\d,]+(?:\.\d+)?)\s*円?/);return m?Number(m[1].replace(/,/g,'')):null;}
function parseQty(s){const m=String(s).match(/(?:数量\s*[:：]?\s*)?(\d+(?:\.\d+)?)\s*(個|枚|本|式|台|セット|kg|g|m|mm|組)/i);return m?{qty:Number(m[1]),unitLabel:m[2]}:null;}
function cleanName(s){return normalize(s).replace(/(?:数量\s*[:：]?\s*)?\d+(?:\.\d+)?\s*(個|枚|本|式|台|セット|kg|g|m|mm|組)/ig,'').replace(/単価\s*[:：]?\s*[\d,]+(?:\.\d+)?\s*円?/ig,'').replace(/[\d,]+(?:\.\d+)?\s*円/ig,'').replace(/\s{2,}/g,' ').trim();}

function parseText(){
  const raw=normalize(document.getElementById('source').value);
  const lines=raw.split(/\n+/).map(normalize).filter(Boolean);
  const msg=[];
  const custLine=lines.find(l=>/(様|御中)$/.test(l)); if(custLine) document.getElementById('customer').value=custLine;
  if(/非課税/.test(raw)) document.getElementById('tax').value='0'; else {const tm=raw.match(/(?:消費税|税率|tax)\s*[:：]?\s*(10|8)\s*%/i);if(tm)document.getElementById('tax').value=tm[1];}

  const found=[]; const used=new Set();
  for(let i=0;i<lines.length;i++){
    if(used.has(i)) continue;
    const line=lines[i];
    if(/(様|御中)$/.test(line)||/(消費税|税率|非課税)/.test(line)) continue;
    const q=parseQty(line); if(!q) continue;
    let unitPrice=null; let sourceLine=line;
    const unitM=line.match(/単価\s*[:：]?\s*([\d,]+(?:\.\d+)?)\s*円?/i);
    if(unitM) unitPrice=Number(unitM[1].replace(/,/g,''));
    if(unitPrice===null){const money=[...line.matchAll(/([\d,]+(?:\.\d+)?)\s*円/g)].map(m=>Number(m[1].replace(/,/g,'')));if(money.length) unitPrice=money[money.length-1];}
    if(unitPrice===null && lines[i+1]){const next=lines[i+1]; const nm=next.match(/単価\s*[:：]?\s*([\d,]+(?:\.\d+)?)\s*円?/i);if(nm){unitPrice=Number(nm[1].replace(/,/g,''));used.add(i+1);}}
    let name=cleanName(sourceLine);if(!name) name='明細';if(unitPrice!==null) found.push({name,qty:q.qty,unit:unitPrice,unitLabel:q.unitLabel});
  }
  items=found.length?found:[{name:'',qty:1,unit:0,unitLabel:'個'}];
  if(!found.length) msg.push('明細を自動判定できませんでした。下の明細欄で修正してください。');
  document.getElementById('msg').textContent=msg.join(' '); renderEditor(); render();
}

function renderEditor(){const box=document.getElementById('itemsEditor');box.innerHTML=items.map((it,i)=>`<div class="item-row"><div class="item-head"><span class="item-title">明細 ${i+1}</span>${items.length>1?`<button class="danger" onclick="removeItem(${i})">削除</button>`:''}</div><div class="row3"><div><label>品名</label><input value="${esc(it.name)}" oninput="updateItem(${i},'name',this.value)"></div><div><label>数量</label><input type="number" step="any" value="${it.qty}" oninput="updateItem(${i},'qty',this.value)"></div><div><label>単価</label><input type="number" step="1" value="${it.unit}" oninput="updateItem(${i},'unit',this.value)"></div></div></div>`).join('');}
function updateItem(i,key,val){items[i][key]=key==='name'?val:Number(val)||0;render();}
function addItem(){items.push({name:'',qty:1,unit:0,unitLabel:'個'});renderEditor();render();}
function removeItem(i){items.splice(i,1);if(!items.length)items=[{name:'',qty:1,unit:0,unitLabel:'個'}];renderEditor();render();}

function render(){
  const company=document.getElementById('company').value; const tel=document.getElementById('companyTel').value; const person=document.getElementById('companyPerson').value;
  const customer=document.getElementById('customer').value||'お客様'; const no=document.getElementById('quoteNo').value; const date=document.getElementById('date').value; const valid=document.getElementById('valid').value;
  const taxRate=Number(document.getElementById('tax').value)||0; const note=document.getElementById('note').value;
  const subtotal=items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.unit)||0),0); const tax=Math.floor(subtotal*taxRate/100); const total=subtotal+tax;
  const rows=items.map(it=>{const amount=(Number(it.qty)||0)*(Number(it.unit)||0);return `<tr><td>${esc(it.name||'—')}</td><td class="num">${Number(it.qty)||''}</td><td class="num">${it.unit?yen(it.unit):''}</td><td class="num">${amount?yen(amount):''}</td></tr>`}).join('');
  const companyBlock=(company||tel||person)?`<div class="company">${company?`<strong>${esc(company)}</strong><br>`:''}${tel?`TEL：${esc(tel)}<br>`:''}${person?`担当：${esc(person)}`:''}</div>`:'';
  document.getElementById('quote').innerHTML=`<h2>御 請 求 書</h2><div class="meta"><div><strong>${esc(customer)}</strong><br><br>下記の通りご請求申し上げます。</div><div class="right">請求番号：${esc(no)}<br>発行日：${esc(fmtDate(date))}<br>お振込予定日：${esc(fmtDate(valid))}</div></div>${companyBlock}<table><thead><tr><th>品名</th><th style="width:18%">数量</th><th style="width:25%">単価</th><th style="width:26%">金額</th></tr></thead><tbody>${rows}</tbody></table><div class="totals"><div class="line"><span>小計</span><strong>${yen(subtotal)}</strong></div><div class="line"><span>${taxRate===0?'消費税（非課税）':`消費税（${taxRate}%）`}</span><strong>${yen(tax)}</strong></div><div class="line grand"><span>ご請求額</span><strong>${yen(total)}</strong></div></div>${note?`<div style="margin-top:24px;font-size:13px"><strong>備考：</strong>${esc(note)}</div>`:''}${renderBankBlock()}`;
}
function clearAll(){document.getElementById('source').value='';document.getElementById('customer').value='';document.getElementById('note').value='';document.getElementById('tax').value='10';document.getElementById('date').value=todayISO();document.getElementById('valid').value='';document.getElementById('quoteNo').value=genNo();document.getElementById('msg').textContent='';items=[{name:'',qty:1,unit:0,unitLabel:'個'}];renderEditor();render();}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('date').value=todayISO();
  document.getElementById('quoteNo').value='I'+new Date().getFullYear()+String(new Date().getMonth()+1).padStart(2,'0')+String(new Date().getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*900)+100);
  loadFormat();
  loadBankProfiles();
  parseText();
});
</script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09111f"><title>性格分析アプリ</title><link rel="stylesheet" href="style.css?v=8"></head><body><main class="app">
<section id="home" class="screen active"><div class="card home"><div class="logo">🧠</div><div class="eyebrow">PERSONALITY LAB</div><h1>あなたの「らしさ」を<br><span>16タイプで分析</span></h1><p>20問に答えるだけ。5つの性格傾向と、あなたに近いタイプを表示します。</p><div class="modes"><button class="mode active" data-mode="general">🌟<b>総合性格診断</b><small>普段の考え方・行動を分析</small></button><button class="mode" data-mode="maker">🛠️<b>職人・ものづくり診断</b><small>作業・改善・設計・トラブル対応を分析</small></button></div><button id="start" class="primary">診断をはじめる →</button></div></section>
<section id="quiz" class="screen"><div class="full"><div class="top"><button id="back">←</button><div class="progress"><div class="meta"><span id="count"></span><span id="pct"></span></div><div class="track"><div id="bar"></div></div></div></div><div class="card quiz"><span id="tag"></span><h2 id="question"></h2><div class="answers"><button data-v="5">5　とても当てはまる</button><button data-v="4">4　やや当てはまる</button><button data-v="3">3　どちらともいえない</button><button data-v="2">2　あまり当てはまらない</button><button data-v="1">1　まったく当てはまらない</button></div></div></div></section>
<section id="loading" class="screen"><div class="card center"><div class="orb">🧠</div><h2>性格パターンを分析中…</h2></div></section>
<section id="result" class="screen"><div class="card result"><div id="art" class="art"></div><div class="center"><div class="eyebrow">YOUR TYPE</div><h2 id="type"></h2><div id="code" class="pill"></div><p id="copy"></p></div><canvas id="radar" width="420" height="330"></canvas><div id="scores"></div><div class="infos"><div><h3>強み</h3><ul id="strengths"></ul></div><div><h3>注意ポイント</h3><ul id="cares"></ul></div><div class="wide"><h3>向いている環境</h3><p id="fit"></p></div><div class="wide"><h3>一言でいうと</h3><p id="one"></p></div></div><div class="actions"><button id="share" class="primary">結果を共有</button><button id="retry">もう一度診断</button></div></div></section>
</main><script src="data.js?v=8"></script><script src="app.js?v=8"></script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09111f"><title>性格分析アプリ</title><style>:root{--bg:#09111f;--p:rgba(255,255,255,.09);--l:rgba(255,255,255,.13);--t:#f8fafc;--m:#a7b3c7;--a:#8b5cf6;--b:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif;color:var(--t);background:radial-gradient(circle at 10% 5%,#6d28d955,transparent 30%),radial-gradient(circle at 90% 15%,#0891b244,transparent 30%),linear-gradient(160deg,#07101c,#101a2d)}button{font:inherit}.app{width:min(100%,620px);margin:auto;padding:16px;min-height:100vh}.screen{display:none;min-height:calc(100vh - 32px)}.screen.on{display:flex;align-items:center}.card{width:100%;background:var(--p);border:1px solid var(--l);border-radius:28px;padding:24px;box-shadow:0 24px 70px #0005;backdrop-filter:blur(18px)}.center{text-align:center}.logo{width:72px;height:72px;margin:auto auto 16px;display:grid;place-items:center;border-radius:22px;font-size:34px;background:linear-gradient(135deg,var(--a),var(--b))}.ey{font-size:12px;letter-spacing:.18em;color:#c4b5fd;font-weight:900}.grad{background:linear-gradient(90deg,#c4b5fd,#67e8f9,#6ee7b7);-webkit-background-clip:text;color:transparent}h1{font-size:34px;margin:8px 0}.lead,.muted{color:var(--m);line-height:1.75}.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.mode{color:#fff;text-align:left;padding:16px;border-radius:18px;border:1px solid var(--l);background:#fff1;cursor:pointer}.mode.sel{outline:2px solid #67e8f9;background:#67e8f917}.mode b{display:block;font-size:16px;margin:4px 0}.mode small{color:var(--m);line-height:1.5}.primary,.secondary{width:100%;padding:16px;border-radius:17px;font-weight:900;cursor:pointer}.primary{border:0;color:white;background:linear-gradient(90deg,var(--a),var(--b))}.secondary{border:1px solid var(--l);color:white;background:#fff1}.top{display:flex;gap:12px;align-items:center;margin-bottom:14px}.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--l);background:#fff1;color:#fff}.progwrap{flex:1}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-bottom:6px}.track,.bar{height:10px;border-radius:99px;background:#fff1;overflow:hidden}.prog,.fill{height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.qtag{display:inline-block;padding:7px 10px;border-radius:99px;background:#22d3ee20;color:#a5f3fc;font-size:12px;font-weight:900}.q{font-size:24px;line-height:1.55}.answers{display:grid;gap:9px}.ans{color:#fff;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--l);background:#fff1;cursor:pointer}.ans span{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;border-radius:10px;background:#fff1;font-weight:900}.loading{text-align:center}.orb{width:110px;height:110px;border-radius:50%;margin:0 auto 20px;background:conic-gradient(var(--a),var(--b),#34d399,var(--a));animation:spin 1.2s linear infinite;position:relative}.orb:after{content:"🧠";position:absolute;inset:10px;border-radius:50%;background:#101827;display:grid;place-items:center;font-size:38px}@keyframes spin{to{transform:rotate(360deg)}}.art{width:min(100%,360px);aspect-ratio:4/5;margin:0 auto 14px;border-radius:24px;border:1px solid var(--l);background-size:200% 200%;background-repeat:no-repeat;box-shadow:0 15px 40px #0005}.type{font-size:30px;font-weight:950;margin:6px 0}.pill{display:inline-block;padding:6px 10px;border:1px solid var(--l);border-radius:99px;color:#dbeafe;font-size:12px}.radar{margin:16px 0;padding:10px;border:1px solid var(--l);border-radius:20px;background:#fff1}canvas{width:100%;max-width:400px;display:block;margin:auto}.scores{display:grid;gap:12px;margin:16px 0}.row{display:grid;grid-template-columns:72px 1fr 42px;gap:10px;align-items:center}.row b,.num{font-weight:900}.num{text-align:right}.infos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{padding:15px;border:1px solid var(--l);border-radius:17px;background:#fff1}.info.full{grid-column:1/-1}.info h3{font-size:14px;margin:0 0 8px}.info ul{padding-left:18px;margin:0;color:#dbeafe;line-height:1.7;font-size:13px}.info p{margin:0;color:#dbeafe;line-height:1.7;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}@media(max-width:430px){.modes,.infos,.actions{grid-template-columns:1fr}.info.full{grid-column:auto}h1{font-size:30px}.q{font-size:22px}}</style></head><body><div class="app"><section id="home" class="screen on"><div class="card center"><div class="logo">🧠</div><div class="ey">PERSONALITY LAB</div><h1>あなたの「らしさ」を<br><span class="grad">16タイプで分析</span></h1><p class="lead">20問に答えるだけ。5つの性格傾向と、あなたに近いタイプを表示します。</p><div class="modes"><button class="mode sel" data-mode="general">🌟<b>総合性格診断</b><small>普段の考え方・行動を分析</small></button><button class="mode" data-mode="maker">🛠️<b>職人・ものづくり診断</b><small>作業・改善・設計・トラブル対応を分析</small></button></div><button id="start" class="primary">診断をはじめる →</button><p class="muted">ログイン不要 / 約3分 / 20問</p></div></section><section id="quiz" class="screen"><div style="width:100%"><div class="top"><button id="back" class="back">←</button><div class="progwrap"><div class="meta"><span id="count"></span><span id="pct"></span></div><div class="track"><div id="prog" class="prog"></div></div></div></div><div class="card"><span id="tag" class="qtag"></span><h2 id="question" class="q"></h2><div class="answers"><button class="ans" data-v="5"><span>5</span>とても当てはまる</button><button class="ans" data-v="4"><span>4</span>やや当てはまる</button><button class="ans" data-v="3"><span>3</span>どちらともいえない</button><button class="ans" data-v="2"><span>2</span>あまり当てはまらない</button><button class="ans" data-v="1"><span>1</span>まったく当てはまらない</button></div></div></div></section><section id="loading" class="screen"><div class="card loading"><div class="orb"></div><h2>性格パターンを分析中…</h2><p class="muted">5つの傾向から結果を選んでいます。</p></div></section><section id="result" class="screen"><div class="card"><div class="center"><div id="art" class="art"></div><div class="ey">YOUR TYPE</div><div id="type" class="type grad"></div><div id="code" class="pill"></div><p id="copy" class="lead"></p></div><div class="radar"><canvas id="radar" width="420" height="330"></canvas></div><div id="scores" class="scores"></div><div class="infos"><div class="info"><h3>強み</h3><ul id="strengths"></ul></div><div class="info"><h3>注意ポイント</h3><ul id="cares"></ul></div><div class="info full"><h3>向いている環境</h3><p id="fit"></p></div><div class="info full"><h3>一言でいうと</h3><p id="one"></p></div></div><div class="actions"><button id="share" class="primary">結果を共有</button><button id="retry" class="secondary">もう一度診断</button></div></div></section></div><script>const traits=["行動力","社交性","論理性","慎重さ","創造性"];const sheets={A:"assets/A.svg",B:"assets/B.svg",C:"assets/C.svg",D:"assets/D.svg"},pos={1:"0% 0%",2:"100% 0%",3:"0% 100%",4:"100% 100%"};const G=[["行動力","考えるより、まず試してみることが多い。"],["社交性","初対面の人とも比較的すぐに話せる。"],["論理性","感覚より、理由や根拠を重視して判断する。"],["慎重さ","始める前に失敗の可能性をよく考える。"],["創造性","人と違うやり方を考えるのが好きだ。"],["行動力","思いついたことは早めに行動へ移したい。"],["社交性","人と話すことで考えが整理される。"],["論理性","問題が起きると原因を分解して考える。"],["慎重さ","重要な判断では情報を十分集めてから決めたい。"],["創造性","新しい道具や方法を試すことにワクワクする。"],["行動力","多少の不確実さがあっても前に進める。"],["社交性","自分の考えを人に伝えることは苦にならない。"],["論理性","数字や比較表があると判断しやすい。"],["慎重さ","ミスを減らすために確認を複数回する方だ。"],["創造性","既存のやり方を改善するアイデアがよく浮かぶ。"],["行動力","迷ったときは、動きながら考える方だ。"],["社交性","チームで相談しながら進めるのが好きだ。"],["論理性","結論だけでなく『なぜそうなるか』が気になる。"],["慎重さ","予定や手順を決めて進めると安心する。"],["創造性","正解が一つに決まらない課題の方が面白い。"]];const M=[["行動力","新しい工具や機械を見ると、まず触って試したくなる。"],["社交性","作業のコツを人に教えたり共有したりするのが好きだ。"],["論理性","不具合が出ると、原因を一つずつ切り分けて考える。"],["慎重さ","加工前に寸法・材料・工具を必ず確認する方だ。"],["創造性","既存の治具や方法を自分なりに改善したくなる。"],["行動力","試作では、まず一度形にしてから修正していく。"],["社交性","一人で悩むより、詳しい人に聞いた方が早いと思う。"],["論理性","条件変更の結果を数字で比較したくなる。"],["慎重さ","一度うまくいっても再現性があるか確認したい。"],["創造性","『もっと楽にできないか』をよく考える。"],["行動力","多少失敗しても、試す価値があるならやってみる。"],["社交性","作業現場では周囲との声かけを大切にする。"],["論理性","加工条件や手順の理由まで理解したい。"],["慎重さ","段取り前にリスクや干渉を確認する。"],["創造性","専用工具や治具を考えるのが楽しい。"],["行動力","トラブル時でも止まりすぎず、仮説を立てて動ける。"],["社交性","チームで改善案を出し合うのが好きだ。"],["論理性","感覚だけでなくデータを残して次に活かしたい。"],["慎重さ","安全・品質に関わる確認は省略したくない。"],["創造性","『普通はこうする』と言われると別の方法も考えたくなる。"]];const P=[p("A1","突破チャレンジャー",["行動力","創造性"],"慎重さ","思いついたら動く。新しい道を切り開くスピード型。",["着手が速い","新しいことに強い","ゼロから形にできる"],["確認不足になりやすい","勢いで進みすぎることがある"],"新規企画、試作、立ち上げ、改善活動。","迷う時間より、試して学ぶ時間を選ぶ人。"),p("A2","分析クリエイター",["論理性","創造性"],"社交性","仕組みを理解し、より良い方法を考える設計思考タイプ。",["改善が得意","複雑なことを整理できる","アイデアを論理で形にできる"],["考えすぎることがある","一人で抱え込みやすい"],"設計、開発、研究、改善、技術企画。","『なぜ？』と『もっと良くできない？』が同時に浮かぶ人。"),p("A3","精密アナリスト",["論理性","慎重さ"],"行動力","精度・再現性・根拠を重視する分析型。",["ミスを見つけやすい","原因分析が得意","標準化がうまい"],["決断に時間がかかる","完璧を求めすぎることがある"],"品質管理、検査、設計、分析。","速さより、正しさと再現性を積み上げる人。"),p("A4","推進リーダー",["行動力","社交性"],"慎重さ","人を巻き込みながら、物事を前へ進める推進型。",["決断が早い","周囲を動かせる","停滞を打破できる"],["先に進みすぎる","細部を飛ばしやすい"],"リーダー、営業、現場推進、プロジェクト管理。","みんなを連れて進む人。"),p("B1","アイデア発明家",["創造性","行動力"],"社交性","ひらめきをすぐ試し、独自解を見つける発明型。",["発想が豊富","試行錯誤に強い","既成概念に縛られにくい"],["興味が移りやすい","記録や共有が後回しになりやすい"],"試作、R&D、DIY、企画、個人開発。","『こんなの作れないかな』から始まる人。"),p("B2","共創コミュニケーター",["社交性","創造性"],"慎重さ","人との会話からアイデアを広げる共創型。",["反応をつかむ","発想を広げる","場を動かせる"],["細かい詰めが甘くなる","アイデアが散らかりやすい"],"企画、広報、教育、SNS、コミュニティ。","話すほどアイデアが増える人。"),p("B3","調整ストラテジスト",["社交性","論理性"],"創造性","人と情報を整理し、最適な着地点をつくる調整型。",["説明がわかりやすい","合意形成が得意","状況整理がうまい"],["大胆な変更を避けやすい","周囲に合わせすぎる"],"PM、調整役、技術営業、教育。","人と理屈の両方を見て落とし所を作る人。"),p("B4","安定サポーター",["社交性","慎重さ"],"行動力","周囲を見て、安心して進める環境をつくる安定型。",["気配りができる","確認が丁寧","チームを安定させる"],["自分を後回しにしやすい","変化に慎重"],"顧客対応、教育、サポート、品質。","全体がうまく回ることを選ぶ人。"),p("C1","現場オプティマイザー",["行動力","論理性"],"社交性","考えながら動き、現場で答えを見つける改善実行型。",["問題解決が速い","仮説検証が得意","改善を実行できる"],["説明より先に動く","共有が遅れることがある"],"生産技術、設備改善、保全、現場改善。","机上より、現場で答えを出す人。"),p("C2","設計アーキテクト",["論理性","創造性"],"行動力","全体構造を考え、無理のない仕組みに落とし込む設計型。",["構造化が得意","先を読める","複雑なものを整理できる"],["実行までに時間がかかる","細部に入り込みやすい"],"機械設計、システム設計、工程設計。","作る前に完成形が見えている人。"),p("C3","堅実クラフター",["慎重さ","行動力"],"創造性","確認を大切にしながら、着実に手を動かす実務型。",["安定した作業","ミスが少ない","最後までやり切れる"],["大きな変更を避けやすい","新しい方法に慎重"],"製造、組立、保全、施工、運用。","確実な完成を積み上げる人。"),p("C4","実験エンジニア",["行動力","論理性"],"慎重さ","仮説を立て、試し、結果から次を考える実験型。",["検証が速い","データで改善できる","トラブル対応に強い"],["試す回数が増えやすい","安全余裕に注意"],"開発、試験、評価、設備改善。","試験結果で答えを出す人。"),p("D1","集中スペシャリスト",["慎重さ","論理性"],"社交性","一つのことを深く掘り下げ、精度を高める専門型。",["集中力が高い","専門性を伸ばせる","細部に気づく"],["視野が狭くなることがある","相談が遅れやすい"],"専門技術、検査、解析、研究。","狭く深く極める人。"),p("D2","慎重プランナー",["慎重さ","創造性"],"行動力","先を読み、複数の選択肢を用意する計画型。",["リスク想定が得意","代替案を考えられる","準備の質が高い"],["スタートが遅れやすい","不確実さに弱い"],"計画、設計、工程管理、品質企画。","最悪を考えたうえで最善を選ぶ人。"),p("D3","バランサー",["社交性","慎重さ"],"創造性","周囲と歩調を合わせ、安定した成果を作る調和型。",["協調性が高い","継続が得意","関係を安定させる"],["変化の主導が苦手","自分を後回しにしがち"],"チーム運営、顧客対応、教育。","みんなが続けられる形を選ぶ人。"),p("D4","柔軟ジェネラリスト",["創造性","社交性"],"論理性","状況に合わせて発想と人の力を使い分ける柔軟型。",["適応力が高い","発想の幅が広い","新しい場に馴染む"],["細部の詰めが甘くなる","方向性がぶれやすい"],"企画、接客、クリエイティブ、SNS。","その場に合う答えを作る人。" )];function p(code,name,hi,lo,copy,strengths,cares,fit,one){return{code,name,hi,lo,copy,strengths,cares,fit,one}}const T={A1:[95,55,55,20,90],A2:[45,35,90,60,90],A3:[30,40,95,95,45],A4:[95,95,55,35,60],B1:[85,35,55,40,100],B2:[70,95,45,40,90],B3:[55,90,90,65,35],B4:[35,90,55,90,45],C1:[95,40,90,55,60],C2:[35,45,95,75,85],C3:[80,45,60,95,35],C4:[95,50,90,30,75],D1:[30,25,95,90,55],D2:[25,45,65,95,85],D3:[60,80,65,80,60],D4:[70,85,35,55,95]};let mode="general",qs=G,i=0,ans=[];const $=x=>document.getElementById(x);document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");mode=b.dataset.mode});function show(x){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(x).classList.add("on");scrollTo(0,0)}function rq(){$("tag").textContent=qs[i][0];$("question").textContent=qs[i][1];$("count").textContent=`${i+1} / 20`;let z=Math.round((i+1)*5);$("pct").textContent=z+"%";$("prog").style.width=z+"%";$("back").disabled=i===0}function calc(){let s=Object.fromEntries(traits.map(x=>[x,0])),c=Object.fromEntries(traits.map(x=>[x,0]));qs.forEach((q,j)=>{s[q[0]]+=ans[j];c[q[0]]++});traits.forEach(t=>s[t]=Math.round(((s[t]/c[t])-1)/4*100));return s}function general(s){let best,d=1e99;P.forEach(p=>{let x=T[p.code].reduce((a,v,j)=>a+(s[traits[j]]-v)**2,0);if(x<d){d=x;best=p}});return best}function maker(s){let a=Object.entries(s).sort((x,y)=>y[1]-x[1]||traits.indexOf(x[0])-traits.indexOf(y[0])),pair=[a[0][0],a[1][0]].sort().join("|"),code="C1",eq=(x,y)=>pair===[x,y].sort().join("|");if(eq("行動力","論理性"))code=s["慎重さ"]>=50?"C1":"C4";else if(eq("論理性","創造性"))code=s["慎重さ"]>=60?"C2":"A2";else if(eq("行動力","創造性"))code=s["社交性"]<55?"B1":"A1";else if(eq("行動力","社交性"))code=s["論理性"]>=50?"A4":"B2";else if(eq("社交性","創造性"))code=s["行動力"]>=55?"B2":"D4";else if(eq("論理性","慎重さ"))code=s["社交性"]<45?"D1":"A3";else if(eq("社交性","慎重さ"))code=s["行動力"]<55?"B4":"D3";else if(eq("慎重さ","創造性"))code=s["論理性"]>=50?"D2":"D4";else if(eq("行動力","慎重さ"))code=s["創造性"]<65?"C3":"A1";else if(eq("社交性","論理性"))code=s["慎重さ"]>=45?"B3":"A4";return P.find(x=>x.code===code)}function radar(s){let c=$("radar"),x=c.getContext("2d"),w=c.width,h=c.height,cx=w/2,cy=h/2,R=108,aa=traits.map((_,j)=>-Math.PI/2+j*2*Math.PI/5),pt=(a,r)=>[cx+Math.cos(a)*r,cy+Math.sin(a)*r];x.clearRect(0,0,w,h);for(let k=1;k<=5;k++){x.beginPath();aa.forEach((a,j)=>{let[q,r]=pt(a,R*k/5);j?x.lineTo(q,r):x.moveTo(q,r)});x.closePath();x.strokeStyle="#ffffff22";x.stroke()}x.beginPath();traits.forEach((t,j)=>{let[q,r]=pt(aa[j],R*s[t]/100);j?x.lineTo(q,r):x.moveTo(q,r)});x.closePath();x.fillStyle="#6366f166";x.fill();x.strokeStyle="#67e8f9";x.lineWidth=3;x.stroke();x.font="700 13px sans-serif";x.fillStyle="#e5eefc";x.textAlign="center";traits.forEach((t,j)=>{let[q,r]=pt(aa[j],R+33);x.fillText(t,q,r+5)})}function result(){let s=calc(),p=mode==="maker"?maker(s):general(s),a=$("art");a.style.backgroundImage=`url(${sheets[p.code[0]]})`;a.style.backgroundPosition=pos[p.code[1]];$("type").textContent=p.name;$("code").textContent=`TYPE ${p.code} ・ $

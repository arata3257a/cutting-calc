<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NC工具管理｜通常版・期限なし</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px 12px 80px}.trial{padding:10px;margin-bottom:10px;text-align:center;border:1px solid #f59e0b;border-radius:12px;background:#451a03;color:#fde68a;font-weight:800}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.head h1{font-size:22px;margin:0}.sub{font-size:12px;color:#94a3b8;margin-top:4px}.actions,.row,.tabs,.cardActions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #334155;background:#1f2937;color:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.primary{background:#38bdf8;color:#082f49;border:0}.ok{background:#22c55e;color:#052e16;border:0}.warn{background:#f59e0b;color:#451a03;border:0}.danger{background:#ef4444;border:0}.bar{position:sticky;top:0;z-index:10;background:#111827ee;border:1px solid #334155;border-radius:14px;padding:10px;margin-top:12px;backdrop-filter:blur(8px)}input,select,textarea{width:100%;border:1px solid #334155;background:#0b1220;color:#fff;border-radius:10px;padding:10px}.search{display:grid;grid-template-columns:1fr 140px;gap:8px}.tabs{margin-top:8px;overflow:auto}.tab{white-space:nowrap;padding:8px 11px;border-radius:999px;border:1px solid #334155;background:#0b1220;color:#94a3b8}.tab.on{background:#38bdf8;color:#082f49;border-color:#38bdf8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat,.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:12px}.stat b{font-size:24px}.stat span{display:block;font-size:11px;color:#94a3b8;margin-top:2px}.list{display:grid;gap:9px}.top{display:flex;justify-content:space-between;gap:10px}.no{font-size:12px;color:#38bdf8;font-weight:800}.name{font-size:17px;font-weight:800;margin:3px 0 7px}.meta{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:12px;border:1px solid #334155;padding:4px 7px;border-radius:999px}.stock{text-align:center;min-width:70px;border:1px solid #334155;border-radius:11px;padding:7px}.stock b{font-size:20px}.low{color:#fbbf24;border-color:#f59e0b}.zero{color:#f87171;border-color:#ef4444}.place,.note{font-size:13px;margin-top:8px}.note{color:#94a3b8}.cardActions{margin-top:10px}.small{padding:7px 9px;font-size:12px}.empty{text-align:center;padding:42px 10px;color:#94a3b8;border:1px dashed #334155;border-radius:14px}.hist{display:grid;grid-template-columns:145px 80px 1fr 70px;gap:8px;padding:10px 0;border-bottom:1px solid #334155;font-size:12px}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{width:min(680px,100%);max-height:92vh;overflow:auto;background:#111827;border:1px solid #334155;border-radius:16px;padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g label{font-size:11px;color:#94a3b8;display:block;margin-bottom:4px}.full{grid-column:1/-1}.dlgActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.lock{text-align:center}.lock h2{margin-top:0}.foot{text-align:center;color:#64748b;font-size:11px;margin-top:18px;line-height:1.6}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.hist{grid-template-columns:1fr 70px}.hist .desc{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap"><div class="trial" style="background:#052e16;border-color:#22c55e;color:#bbf7d0;">通常版｜期限なし</div>
<div class="head"><div><h1>NC工具管理</h1><div class="sub">APIなし・無料・期限なし｜工具検索・在庫・入出庫履歴</div></div><div class="actions"><button class="btn primary" onclick="openEdit()">＋工具登録</button><button class="btn" onclick="backup()">バックアップ</button><button class="btn" onclick="document.getElementById('imp').click()">復元</button><button class="btn" onclick="csv()">CSV</button><input id="imp" type="file" accept=".json" hidden onchange="restore(event)"></div></div>
<div class="bar"><div class="search"><input id="q" placeholder="工具番号・工具名・サイズ・メーカー・場所で検索" oninput="render()"><select id="sf" onchange="render()"><option value="all">在庫すべて</option><option value="low">少ない</option><option value="zero">在庫0</option></select></div><div class="tabs" id="tabs"><button class="tab on" data-c="all">すべて</button><button class="tab" data-c="タップ">タップ</button><button class="tab" data-c="エンドミル">エンドミル</button><button class="tab" data-c="ドリル">ドリル</button><button class="tab" data-c="その他">その他</button><button class="tab" data-c="history">入出庫履歴</button></div></div>
<div id="stats" class="stats"></div><div id="content"></div>
<div class="foot">データはこのブラウザ内に保存されます。通常版です。利用期限はありません。お試し版とは別の保存領域を使用します。<br>ブラウザデータ削除や別端末では保存内容・開始日は共有されません。</div>
</div>

<div id="editModal" class="modal"><div class="dialog"><h2 id="editTitle">工具登録</h2><div class="grid">
<div class="g"><label>工具番号 *</label><input id="fNo"></div><div class="g"><label>工具名 *</label><input id="fName"></div>
<div class="g"><label>サイズ</label><input id="fSize" placeholder="φ10 / M6×1.0"></div><div class="g"><label>種類</label><select id="fType"><option>エンドミル</option><option>タップ</option><option>ドリル</option><option>その他</option></select></div>
<div class="g"><label>メーカー</label><input id="fMaker"></div><div class="g"><label>保管場所</label><input id="fLoc"></div>
<div class="g"><label>在庫数</label><input id="fStock" type="number" min="0" value="0"></div><div class="g"><label>少量警告ライン</label><input id="fMin" type="number" min="0" value="2"></div>
<div class="g full"><label>備考</label><textarea id="fNote"></textarea></div></div><div class="dlgActions"><button class="btn" onclick="closeEdit()">キャンセル</button><button class="btn primary" onclick="saveTool()">保存</button></div></div></div>

<div id="moveModal" class="modal"><div class="dialog" style="width:min(430px,100%)"><h2 id="moveTitle">入出庫</h2><div class="g"><label>数量</label><input id="moveQty" type="number" min="1" value="1"></div><div class="g" style="margin-top:9px"><label>メモ</label><input id="moveMemo" placeholder="例：MC-1で使用"></div><div class="dlgActions"><button class="btn" onclick="closeMove()">キャンセル</button><button class="btn primary" onclick="doMove()">確定</button></div></div></div>

<script>
var KEY='nc_tool_manager_full_public_v1',cat='all',editId=null,moveCtx=null;
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function now(){return new Date().toISOString()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&x.tools&&x.history)return x}catch(e){}var x={tools:[{id:id(),no:'EM-001',name:'超硬4枚刃エンドミル',size:'φ10',type:'エンドミル',maker:'OSG',stock:5,min:2,loc:'工具棚A-1',note:'サンプル',updated:now()},{id:id(),no:'TP-001',name:'スパイラルタップ',size:'M6×1.0',type:'タップ',maker:'YAMAWA',stock:2,min:2,loc:'工具棚B-2',note:'',updated:now()},{id:id(),no:'DR-001',name:'超硬ドリル',size:'φ5.0',type:'ドリル',maker:'MITSUBISHI',stock:0,min:2,loc:'工具棚C-1',note:'',updated:now()}],history:[]};localStorage.setItem(KEY,JSON.stringify(x));return x}
var data=load();
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function guard(){return true}
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('.tab');if(!b)return;document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});b.classList.add('on');cat=b.dataset.c;render()}
function stats(){var total=data.tools.length,sum=data.tools.reduce(function(a,t){return a+Number(t.stock||0)},0),low=data.tools.filter(function(t){return Number(t.stock)>0&&Number(t.stock)<=Number(t.min||0)}).length,zero=data.tools.filter(function(t){return Number(t.stock)===0}).length;document.getElementById('stats').innerHTML='<div class="stat"><b>'+total+'</b><span>登録工具</span></div><div class="stat"><b>'+sum+'</b><span>総在庫数</span></div><div class="stat"><b>'+low+'</b><span>在庫少なめ</span></div><div class="stat"><b>'+zero+'</b><span>在庫0</span></div>'}
function list(){var q=document.getElementById('q').value.trim().toLowerCase(),sf=document.getElementById('sf').value,a=data.tools.slice();if(cat!=='all'&&cat!=='history')a=a.filter(function(t){return t.type===cat});if(q)a=a.filter(function(t){return [t.no,t.name,t.size,t.type,t.maker,t.loc,t.note].some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0})});if(sf==='zero')a=a.filter(function(t){return Number(t.stock)===0});if(sf==='low')a=a.filter(function(t){return Number(t.stock)>0&&Number(t.stock)<=Number(t.min||0)});return a.sort(function(a,b){return String(a.no).localeCompare(String(b.no),'ja',{numeric:true})})}
function card(t){var n=Number(t.stock||0),cl=n===0?'zero':(n<=Number(t.min||0)?'low':'');return '<div class="card"><div class="top"><div><div class="no">'+esc(t.no)+'</div><div class="name">'+esc(t.name)+'</div><div class="meta"><span class="pill">'+esc(t.type)+'</span>'+(t.size?'<span class="pill">'+esc(t.size)+'</span>':'')+(t.maker?'<span class="pill">'+esc(t.maker)+'</span>':'')+'</div></div><div class="stock '+cl+'"><b>'+n+'</b><div style="font-size:10px">在庫</div></div></div><div class="place">📍 '+esc(t.loc||'保管場所未登録')+'</div>'+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'<div class="cardActions"><button class="btn ok small" onclick="openMove(\''+t.id+'\',\'in\')">＋入庫</button><button class="btn warn small" onclick="openMove(\''+t.id+'\',\'out\')">－出庫</button><button class="btn small" onclick="openEdit(\''+t.id+'\')">編集</button><button class="btn danger small" onclick="del(\''+t.id+'\')">削除</button></div></div>'}
function history(){var a=data.history.slice().sort(function(a,b){return String(b.time).localeCompare(String(a.time))});if(!a.length){document.getElementById('content').innerHTML='<div class="empty">入出庫履歴はまだありません。</div>';return}document.getElementById('content').innerHTML='<div class="card">'+a.map(function(h){return '<div class="hist"><div>'+new Date(h.time).toLocaleString('ja-JP')+'</div><div>'+(h.kind==='入庫'?'＋':'－')+h.qty+'</div><div class="desc">'+esc(h.no)+'｜'+esc(h.name)+(h.memo?'｜'+esc(h.memo):'')+'</div><div>残 '+h.after+'</div></div>'}).join('')+'</div>'}
function render(){stats();if(cat==='history'){history();return}var a=list();document.getElementById('content').innerHTML=a.length?'<div class="list">'+a.map(card).join('')+'</div>':'<div class="empty">該当する工具がありません。</div>'}
function openEdit(x){if(!guard())return;editId=x||null;var t=x?data.tools.find(function(v){return v.id===x}):null;document.getElementById('editTitle').textContent=t?'工具編集':'工具登録';document.getElementById('fNo').value=t?t.no:'';document.getElementById('fName').value=t?t.name:'';document.getElementById('fSize').value=t?t.size:'';document.getElementById('fType').value=t?t.type:'エンドミル';document.getElementById('fMaker').value=t?t.maker:'';document.getElementById('fLoc').value=t?t.loc:'';document.getElementById('fStock').value=t?t.stock:0;document.getElementById('fMin').value=t?t.min:2;document.getElementById('fNote').value=t?t.note:'';document.getElementById('editModal').classList.add('show')}
function closeEdit(){document.getElementById('editModal').classList.remove('show')}
function saveTool(){if(!guard())return;var no=document.getElementById('fNo').value.trim(),name=document.getElementById('fName').value.trim();if(!no||!name){alert('工具番号と工具名は必須です');return}if(data.tools.some(function(t){return t.id!==editId&&String(t.no).toLowerCase()===no.toLowerCase()})){alert('同じ工具番号があります');return}var t={id:editId||id(),no:no,name:name,size:document.getElementById('fSize').value.trim(),type:document.getElementById('fType').value,maker:document.getElementById('fMaker').value.trim(),loc:document.getElementById('fLoc').value.trim(),stock:Math.max(0,Number(document.getElementById('fStock').value)||0),min:Math.max(0,Number(document.getElementById('fMin').value)||0),note:document.getElementById('fNote').value.trim(),updated:now()};if(editId){data.tools[data.tools.findIndex(function(v){return v.id===editId})]=t}else data.tools.push(t);save();closeEdit();render()}
function del(x){if(!guard())return;var t=data.tools.find(function(v){return v.id===x});if(t&&confirm('「'+t.no+' '+t.name+'」を削除しますか？')){data.tools=data.tools.filter(function(v){return v.id!==x});save();render()}}
function openMove(x,k){if(!guard())return;var t=data.tools.find(function(v){return v.id===x});moveCtx={id:x,k:k};document.getElementById('moveTitle').textContent=(k==='in'?'入庫｜':'出庫｜')+t.no+' '+t.name;document.getElementById('moveQty').value=1;document.getElementById('moveMemo').value='';document.getElementById('moveModal').classList.add('show')}
function closeMove(){document.getElementById('moveModal').classList.remove('show');moveCtx=null}
function doMove(){if(!guard()||!moveCtx)return;var t=data.tools.find(function(v){return v.id===moveCtx.id}),q=Math.floor(Number(document.getElementById('moveQty').value)||0),memo=document.getElementById('moveMemo').value.trim();if(q<1){alert('数量は1以上です');return}if(moveCtx.k==='out'&&q>Number(t.stock)){alert('在庫数を超えています');return}t.stock=moveCtx.k==='in'?Number(t.stock)+q:Number(t.stock)-q;t.updated=now();data.history.push({time:now(),kind:moveCtx.k==='in'?'入庫':'出庫',qty:q,no:t.no,name:t.name,after:t.stock,memo:memo});save();closeMove();render()}
function dl(s,n,type){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:type}));a.href=u;a.download=n;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function backup(){dl(JSON.stringify({app:'NC工具管理',version:1,exportedAt:now(),tools:data.tools,history:data.history},null,2),'NC工具管理_バックアップ.json','application/json')}
function restore(e){if(!guard()){e.target.value='';return}var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!Array.isArray(x.tools)||!Array.isArray(x.history))throw 0;if(confirm('現在のデータを置き換えますか？')){data={tools:x.tools,history:x.history};save();render()}}catch(z){alert('読み込めないファイルです')}e.target.value=''};r.readAsText(f,'UTF-8')}
function csv(){if(!guard())return;function c(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}var rows=[['工具番号','工具名','サイズ','種類','メーカー','在庫数','警告ライン','保管場所','備考']].concat(data.tools.map(function(t){return [t.no,t.name,t.size,t.type,t.maker,t.stock,t.min,t.loc,t.note]}));dl('\ufeff'+rows.map(function(r){return r.map(c).join(',')}).join('\r\n'),'NC工具一覧.csv','text/csv;charset=utf-8')}
render();
</script>
</body></html>

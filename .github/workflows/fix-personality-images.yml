name: Fix personality result images

on:
  push:
    paths:
      - '.github/workflows/fix-personality-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and re-encode embedded JPEG sprites
        shell: bash
        run: |
          set -e
          mkdir -p personality-app/assets
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageFile, ImageEnhance, ImageFilter
          import re, base64

          ImageFile.LOAD_TRUNCATED_IMAGES = True

          for letter in 'ABCD':
              p = Path(f'personality-app/assets/{letter}.svg')
              s = p.read_text(encoding='utf-8')
              m = re.search(r'data:image/jpeg;base64,([^"\']+)', s)
              if not m:
                  raise SystemExit(f'JPEG data not found in {p}')

              data = re.sub(r'\s+', '', m.group(1)).rstrip('=')
              # The old SVG payloads were truncated/malformed. Remove the
              # impossible trailing base64 character if needed, then pad.
              while len(data) % 4 == 1:
                  data = data[:-1]
              data += '=' * ((4 - len(data) % 4) % 4)
              raw = base64.b64decode(data, validate=False)

              try:
                  im = Image.open(BytesIO(raw)).convert('RGB')
                  im.load()
              except Exception as e:
                  raise SystemExit(f'Cannot decode {letter}: {e}')

              # Current source is a 2x2 sprite. Re-encode into a normal JPEG
              # and upscale once so Android/Chrome does not stretch a broken
              # embedded image at render time.
              target = (im.width * 2, im.height * 2)
              im = im.resize(target, Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.1, percent=120, threshold=2))
              out = Path(f'personality-app/assets/{letter}-v92.jpg')
              im.save(out, 'JPEG', quality=92, optimize=True, progressive=True)
              print(letter, im.size, out.stat().st_size)
          PY

      - name: Point app to repaired JPEG sprites
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('personality-app/v91-engine1.js')
          s = p.read_text(encoding='utf-8')
          import re
          s, n = re.subn(
              r'const SHEETS=\{A:"assets/A[^\"]*",B:"assets/B[^\"]*",C:"assets/C[^\"]*",D:"assets/D[^\"]*"\};',
              'const SHEETS={A:"assets/A-v92.jpg?v=92",B:"assets/B-v92.jpg?v=92",C:"assets/C-v92.jpg?v=92",D:"assets/D-v92.jpg?v=92"};',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('SHEETS line not found')
          p.write_text(s, encoding='utf-8')

          p = Path('personality-app/v91-style.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('width:min(100%,370px);aspect-ratio:561/701', 'width:min(100%,330px);aspect-ratio:4/5')
          s = s.replace('.art{width:100%}', '.art{width:min(100%,330px)}')
          p.write_text(s, encoding='utf-8')

          p = Path('personality-app/index.html')
          s = p.read_text(encoding='utf-8').replace('v=91', 'v=92')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add personality-app/assets/A-v92.jpg personality-app/assets/B-v92.jpg personality-app/assets/C-v92.jpg personality-app/assets/D-v92.jpg personality-app/v91-engine1.js personality-app/v91-style.css personality-app/index.html
          git commit -m 'Fix personality character image rendering' || exit 0
          git push

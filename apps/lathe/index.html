<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.json"><title>旋盤条件かんたん計算</title><style>body{font-family:system-ui;background:#071525;color:#eef5ff;margin:0}.w{max-width:560px;margin:auto;padding:18px}.h{background:#102a43;border-bottom:4px solid #d4af37}.card{background:#10243a;padding:16px;border-radius:14px;margin:14px 0}label{display:block;font-size:13px;margin:12px 0 5px;color:#b8c9da}select,input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:0;background:#fff;color:#111}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b{background:#071b2d;padding:12px;border-radius:10px}.v{font-size:23px;font-weight:800;color:#ffd75e}.note{font-size:12px;color:#b8c9da}.ok{color:#9fe3b1}.warn{color:#ffd75e;font-weight:700}.trial{position:sticky;top:8px;z-index:5;background:#17314b;border:1px solid #d4af37;padding:10px 14px;border-radius:12px;margin:12px 0;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}.trialRow{display:flex;justify-content:center;align-items:baseline;gap:6px;flex-wrap:wrap}.trial strong{font-size:28px;line-height:1;color:#ffd75e}.trial.soon{background:#46351a;border-color:#ffb84d}.trial.soon strong{color:#ffcf70}.expired{background:#4a1720;border:1px solid #ff7184;color:#fff}.expired strong{color:#fff}.locked{opacity:.35;pointer-events:none;user-select:none}@media(max-width:380px){.w{padding:12px}.trial strong{font-size:25px}.g{gap:8px}.b{padding:10px}.v{font-size:21px}}</style></head><body><header class="h"><div class="w"><b style="font-size:22px">旋盤条件かんたん計算</b><div class="note">初心者向け・メーカー公開条件基準</div></div></header><main class="w"><div id="trialBox" class="trial"><div class="trialRow"><span>試用期間 残り</span><strong id="trialDays">--</strong><span>日</span></div><div class="note" id="trialDate"></div></div><div id="appArea"><div class="card"><label>被削材</label><select id="mat"><option value="s45c">S45C / 中炭素鋼</option><option value="sus">SUS304 / SUS316</option><option value="al">アルミ合金</option></select><label>加工</label><select id="op"></select><label>加工径 D（mm）</label><input id="dia" type="number" min="1" step="1" value="20"><label>切削速度 Vc</label><select id="vc"></select><label>機械の最高回転数（min⁻¹）</label><input id="maxrpm" type="number" min="100" step="100" value="3000"><label>加工長さ L（mm）</label><input id="length" type="number" min="0" step="1" value="50"></div><div class="card"><div class="g"><div class="b">回転数 N<div class="v" id="n">-</div><span class="note">min⁻¹</span></div><div class="b">切削速度 Vc<div class="v" id="vco">-</div><span class="note">m/min</span></div><div class="b">送り f<div class="v" id="feed">-</div><span class="note">mm/rev</span></div><div class="b">送り速度<div class="v" id="feedmin">-</div><span class="note">mm/min</span></div><div class="b">切込み ap<div class="v" id="ap">-</div><span class="note">mm</span></div><div class="b">切削時間<div class="v" id="time">-</div><span class="note">秒（概算）</span></div></div></div><div class="card note"><span class="ok">● メーカー公開条件を基準</span><br><span id="src"></span><br><span id="warn"></span><br>「標準中央」は公開範囲の中央値をアプリが計算した参考スタート値です。メーカー指定の単一推奨値ではありません。溝・突切りは工具幅や形状の影響が大きいため、apは表示しません。切削時間は加工長さ÷送り速度の単純計算で、アプローチ・退避・加減速は含みません。</div></div></main><script>
const TRIAL_DAYS=30,TRIAL_KEY='latheTrialStartV1';function trialCheck(){let now=Date.now(),s=Number(localStorage.getItem(TRIAL_KEY));if(!s||s>now){s=now;localStorage.setItem(TRIAL_KEY,String(s))}let end=s+TRIAL_DAYS*86400000,remain=Math.max(0,Math.ceil((end-now)/86400000));trialDays.textContent=remain;trialDate.textContent='有効期限：'+new Date(end).toLocaleDateString('ja-JP');trialBox.classList.toggle('soon',remain<=7&&remain>0);if(now>=end){trialBox.classList.remove('soon');trialBox.classList.add('expired');trialBox.innerHTML='<strong>試用期間が終了しました</strong><div class="note">30日間の利用期限を過ぎています。</div>';appArea.classList.add('locked');return false}return true}
const turn={s45c:{src:'タンガロイ T9200 / T9215',finish:[150,400,.1,.4,.3,1.5],medium:[150,400,.15,.5,.5,5.5]},sus:{src:'タンガロイ T6200/AH6200 / AH6225',finish:[90,200,.08,.45,.5,2.5],medium:[90,200,.2,.5,1,4]},al:{src:'タンガロイ 非鉄金属加工用',finish:[300,2500,.03,.3,.1,2]}};const groove={s45c:{src:'タンガロイ TungCut / DuoJustCut',vc:[50,180],f:[.01,.05]},sus:{src:'タンガロイ TungCut / DuoJustCut',vc:[50,120],f:[.01,.05]},al:{src:'タンガロイ DuoJustCut（A5056/A6061等）',vc:[150,200],f:[.01,.05]}};function mid(a,b){return(a+b)/2}function build(){let m=mat.value,o=[];if(turn[m].finish)o.push(['finish','外径・仕上げ'],['face','端面・仕上げ'],['internal','内径・仕上げ']);if(turn[m].medium)o.push(['medium','外径・中切削'],['internalMedium','内径・中切削']);o.push(['groove','溝入れ'],['part','突切り']);op.innerHTML=o.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');render()}function get(){let m=mat.value,k=op.value;if(k==='groove'||k==='part'){let x=groove[m];return{src:x.src,vc:x.vc,f:x.f,ap:null}}let base=(k==='medium'||k==='internalMedium')?'medium':'finish',x=turn[m][base];return{src:turn[m].src,vc:[x[0],x[1]],f:[x[2],x[3]],ap:[x[4],x[5]]}}function render(){let d=get(),M=mid(d.vc[0],d.vc[1]);vc.innerHTML=`<option value="${M}">標準中央 ${M} m/min</option><option value="${d.vc[0]}">低め ${d.vc[0]} m/min</option><option value="${d.vc[1]}">高め ${d.vc[1]} m/min</option>`;src.textContent='基準：'+d.src;calc()}function calc(){let d=get(),D=+dia.value,V=+vc.value,maxN=+maxrpm.value,L=+length.value;if(D<=0||maxN<=0)return;let calcN=Math.round(1000*V/(Math.PI*D)),useN=Math.min(calcN,maxN),f=mid(d.f[0],d.f[1]),F=useN*f,t=F>0&&L>=0?(L/F*60):0;n.textContent=useN.toLocaleString();vco.textContent=V;feed.textContent=f.toFixed(3);feedmin.textContent=Math.round(F).toLocaleString();ap.textContent=d.ap?mid(d.ap[0],d.ap[1]).toFixed(2):'—';time.textContent=t.toFixed(1);if(calcN>maxN){warn.innerHTML='<span class="warn">⚠ 計算回転数 '+calcN.toLocaleString()+' min⁻¹ は機械の最高回転数を超えるため、回転数Nを '+maxN.toLocaleString()+' min⁻¹ にしました。</span>'}else{warn.textContent=''}}trialCheck();mat.onchange=build;op.onchange=render;dia.oninput=calc;vc.onchange=calc;maxrpm.oninput=calc;length.oninput=calc;build();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>

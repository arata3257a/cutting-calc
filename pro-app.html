<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加工条件かんたん計算 PRO</title><style>body{font-family:system-ui;background:#071525;color:#eaf2ff;margin:0}.wrap{max-width:520px;margin:auto;padding:18px}.head{background:#102a43;padding:18px;border-bottom:4px solid #d4af37}.pro{background:#d4af37;color:#111;padding:4px 10px;border-radius:20px;font-weight:800}.card{background:#10243a;border:1px solid #29445f;border-radius:14px;padding:16px;margin:14px 0}label{display:block;font-size:12px;color:#a9bdd2;margin:12px 0 5px}select{width:100%;padding:12px;border-radius:9px;background:#fff;color:#111}.result{font-size:25px;font-weight:800;color:#ffd75e}.note{font-size:12px;color:#a9bdd2}.gold{color:#ffd75e}</style></head><body><div class="head"><div class="wrap"><b style="font-size:22px">加工条件かんたん計算</b> <span class="pro">PRO</span><div class="note">公式メーカー条件を基準にした詳細モード</div></div></div><main class="wrap"><div class="card"><label>材料グループ</label><select id="group" onchange="render()"><option value="carbon">炭素鋼</option><option value="alloy">合金鋼</option><option value="hard">高硬度材</option></select><label>材料・硬度</label><select id="material"></select><label>加工方法</label><select id="method"></select><label>工具径</label><select id="dia"></select></div><div class="card"><div class="gold">参考スタート条件</div><p class="result" id="summary">選択してください</p><div id="detail" class="note"></div></div><div class="card note"><b>PROの方針</b><br>メーカー公開条件を基準に表示。工具形状・突出し量・保持剛性・クーラント・機械仕様により調整してください。補間値や推測値は登録しません。</div></main><script>
const db={carbon:{materials:['S45C / S50C 焼鈍材（～225HB）'],methods:['側面加工','溝加工','Z切込み'],dias:['φ1','φ2','φ3','φ4','φ5','φ6','φ7','φ8','φ9','φ10','φ11','φ12','φ13','φ16','φ20'],source:'UNION TOOL CZS'},alloy:{materials:['SK / SCM 焼鈍材（225～325HB）'],methods:['側面加工','溝加工','Z切込み'],dias:['φ6','φ7','φ8','φ9','φ10','φ11','φ12'],source:'UNION TOOL CZS 3D刃長'},hard:{materials:['SKD11（55～62HRC）','HAP10（62～66HRC）','HAP72（66～70HRC）'],methods:['仕上げ加工'],dias:['φ1','φ1.5','φ2','φ3','φ4','φ5','φ6','φ8','φ10','φ12'],source:'UNION TOOL HGS'}};
function fill(id,a){document.getElementById(id).innerHTML=a.map(x=>`<option>${x}</option>`).join('')}
function render(){const d=db[group.value];fill('material',d.materials);fill('method',d.methods);fill('dia',d.dias);show()}
function show(){const d=db[group.value];summary.textContent=`${material.value} / ${method.value} / ${dia.value}`;detail.innerHTML=`基準工具・出典：${d.source}<br>数値条件は公式表照合済みデータから順次接続します。`}
['material','method','dia'].forEach(id=>document.getElementById(id).addEventListener('change',show));render();
</script></body></html>

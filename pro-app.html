<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加工条件かんたん計算 PRO</title><style>body{font-family:system-ui;background:#071525;color:#eaf2ff;margin:0}.wrap{max-width:520px;margin:auto;padding:18px}.head{background:#102a43;padding:18px;border-bottom:4px solid #d4af37}.pro{background:#d4af37;color:#111;padding:4px 10px;border-radius:20px;font-weight:800}.card{background:#10243a;border:1px solid #29445f;border-radius:14px;padding:16px;margin:14px 0}label{display:block;font-size:12px;color:#a9bdd2;margin:12px 0 5px}select{width:100%;padding:12px;border-radius:9px;background:#fff;color:#111}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#071b2d;border-radius:10px;padding:12px}.v{font-size:22px;font-weight:800;color:#ffd75e}.note{font-size:12px;color:#a9bdd2}.gold{color:#ffd75e;font-weight:800}</style></head><body><div class="head"><div class="wrap"><b style="font-size:22px">加工条件かんたん計算</b> <span class="pro">PRO</span><div class="note">メーカー公開条件を基準にした詳細モード</div></div></div><main class="wrap"><div class="card"><label>材料・硬度</label><select id="material"></select><label>工具径（1mm単位・公式条件がある径のみ）</label><select id="dia"></select><label>刃長</label><select id="loc"></select></div><div class="card"><div class="gold">HGS 6枚刃・荒加工 参考スタート条件</div><div class="grid"><div class="box">回転数 N<div class="v" id="n">-</div><span class="note">min⁻¹</span></div><div class="box">送り F<div class="v" id="f">-</div><span class="note">mm/min</span></div><div class="box">ap<div class="v" id="ap">-</div><span class="note">mm</span></div><div class="box">ae<div class="v" id="ae">-</div><span class="note">mm</span></div><div class="box">Vc<div class="v" id="vc">-</div><span class="note">m/min（計算）</span></div><div class="box">fz<div class="v" id="fz">-</div><span class="note">mm/tooth（計算）</span></div></div></div><div class="card note">基準工具：UNION TOOL HGS（6枚刃）／荒加工条件。N・F・ap・aeはメーカー公開値、Vc・fzはそこから計算。補間値は使用しません。刃長で条件が変わるため、径だけで条件を決定しません。</div></main><script>
const rows=[
[1,2,7200,930,1.5,.01,7000,620,1.5,.01,6200,530,1.5,.005],[1,3,6600,780,1.5,.01,6400,520,1.5,.01,5600,440,1.5,.005],
[2,4,6800,980,3,.04,6600,650,3,.04,5800,550,3,.04],[2,6,6100,810,3,.04,6000,540,3,.04,5300,460,3,.04],
[3,6,6200,990,4.5,.06,6100,660,4.5,.06,5400,560,4.5,.06],[3,9,5600,830,4.5,.06,5500,550,4.5,.06,4800,470,4.5,.06],[3,15,2900,420,4.5,.03,2800,280,4.5,.03,2400,80,4.5,.03],
[4,8,5700,1020,6,.08,5600,680,6,.08,4900,580,6,.08],[4,12,5200,860,6,.08,5100,570,6,.08,4500,480,6,.08],[4,20,2700,430,6,.04,2600,290,6,.04,2300,80,6,.04],
[5,10,5200,1050,7.5,.1,5100,700,7.5,.1,4500,600,7.5,.1],[5,15,4700,870,7.5,.1,4600,580,7.5,.1,4100,490,7.5,.1],[5,25,2400,440,7.5,.05,2300,290,7.5,.05,2100,80,7.5,.05],
[6,12,4700,1080,9,.12,4600,720,9,.12,4100,610,9,.12],[6,18,4300,900,9,.12,4200,600,9,.12,3700,510,9,.12],[6,30,2200,450,9,.06,2100,300,9,.06,1900,80,9,.06],
[8,16,4100,920,12,.16,4000,880,12,.16,3500,750,12,.16],[8,24,3700,770,12,.16,3600,730,12,.16,3200,620,12,.16],[8,40,1800,390,12,.08,1800,370,12,.08,530,50,12,.08],
[10,20,3600,1090,15,.2,3500,1040,15,.2,3100,880,15,.2],[10,30,3300,910,15,.2,3200,870,15,.2,2800,740,15,.2],[10,50,1600,460,15,.1,1600,440,15,.1,470,60,15,.1],
[12,24,3400,1260,18,.24,3300,1200,18,.24,2900,1020,18,.24],[12,36,3100,1050,18,.24,3000,1000,18,.24,2600,850,18,.24],[12,60,1500,530,18,.12,1500,500,18,.12,430,60,18,.12]
];
const mats=['SKD11（55～62HRC）','HAP10（62～66HRC）','HAP72（66～70HRC）'];
material.innerHTML=mats.map((x,i)=>`<option value="${i}">${x}</option>`).join('');
const dias=[...new Set(rows.map(r=>r[0]))];dia.innerHTML=dias.map(x=>`<option value="${x}">φ${x}</option>`).join('');
function locs(){const d=+dia.value,ls=rows.filter(r=>r[0]===d).map(r=>r[1]);loc.innerHTML=ls.map(x=>`<option value="${x}">${x} mm</option>`).join('');show()}
function show(){const d=+dia.value,l=+loc.value,m=+material.value,r=rows.find(x=>x[0]===d&&x[1]===l);if(!r)return;const i=2+m*4,N=r[i],F=r[i+1],AP=r[i+2],AE=r[i+3];n.textContent=N.toLocaleString();f.textContent=F.toLocaleString();ap.textContent=AP;ae.textContent=AE;vc.textContent=(Math.PI*d*N/1000).toFixed(1);fz.textContent=(F/(N*6)).toFixed(3)}
dia.onchange=locs;loc.onchange=show;material.onchange=show;locs();
</script></body></html>

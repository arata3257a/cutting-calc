name: Deploy 2D CAD to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "2d-cad/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload 2D CAD
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./2d-cad"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

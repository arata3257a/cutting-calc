name: Build Reel Finder Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "instagram-reel-auto-finder-android/**"
      - ".github/workflows/build-reel-auto-finder-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK and Gradle
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

          curl -L --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Normalize JavaScript escapes in Java text blocks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('instagram-reel-auto-finder-android/app/src/main/java/com/arata/reelfinder/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          marker = '// JS_ESCAPES_FIXED_V1'

          if marker not in s:
              for name in ('JS_PARSE_REEL', 'JS_PARSE_PROFILE'):
                  head = f'private static final String {name} = """'
                  start = s.index(head)
                  body_start = s.index('"""', start) + 3
                  body_end = s.index('""";', body_start)
                  body = s[body_start:body_end]
                  body = body.replace(chr(92), chr(92) + chr(92))
                  s = s[:body_start] + body + s[body_end:]

              s = s.replace(
                  'package com.arata.reelfinder;\n',
                  'package com.arata.reelfinder;\n\n' + marker + '\n',
                  1
              )
              p.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: instagram-reel-auto-finder-android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reel-auto-finder-debug-apk
          path: instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK or build error log
        if: always()
        shell: bash
        run: |
          mkdir -p downloads
          rm -f downloads/reel-auto-finder-debug.apk downloads/reel-auto-finder-build-error.txt

          if [ -f instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk downloads/reel-auto-finder-debug.apk
            BUILD_OK=1
          else
            cp instagram-reel-auto-finder-android/build.log downloads/reel-auto-finder-build-error.txt || echo "Build failed before log creation" > downloads/reel-auto-finder-build-error.txt
            BUILD_OK=0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads instagram-reel-auto-finder-android/app/src/main/java/com/arata/reelfinder/MainActivity.java
          git commit -m "Update Android reel finder build [skip ci]" || true
          git push

          if [ "$BUILD_OK" != "1" ]; then
            exit 1
          fi

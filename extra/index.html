<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><link rel="manifest" href="manifest.json"><title>加工条件かんたん計算 EXTRA</title><style>body{margin:0;background:#071525;color:#eef5ff;font-family:system-ui}.w{max-width:620px;margin:auto;padding:18px}.head{background:#102a43;border-bottom:4px solid #d4af37}.tag{display:inline-block;background:#d4af37;color:#071525;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:900}.card{background:#10243a;border:1px solid #29445f;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#b8c9da;font-size:13px;margin:11px 0 5px}select,input{width:100%;box-sizing:border-box;padding:12px;border:0;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out{background:#071b2d;border-radius:10px;padding:12px}.v{font-size:23px;font-weight:900;color:#ffd75e}.note{font-size:12px;color:#b8c9da}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#071525;font-weight:900;font-size:17px;margin-top:14px}.warn{color:#ffd75e}.bad{color:#ff8f9d}.good{color:#9fe3b1}.sec{font-size:13px;font-weight:800;color:#dbe8f5;margin-top:4px}.source{background:#0b1e31;border:1px solid #29445f;border-radius:10px;padding:10px;margin-top:10px}.hide{display:none}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.compare>div{background:#0b1e31;border-radius:10px;padding:10px}.compare b{display:block;font-size:11px;color:#b8c9da}.compare strong{font-size:18px;color:#ffd75e}@media(max-width:390px){.w{padding:12px}.grid,.compare{gap:8px}.v{font-size:21px}.out{padding:10px}}</style></head><body><header class="head"><div class="w"><span class="tag">EXTRA</span><h1 style="margin:8px 0 2px">加工条件かんたん計算</h1><div class="note">実加工条件を詰める上位版</div></div></header><main class="w"><div class="card"><div class="sec">条件入力方式</div><select id="mode" onchange="syncMode()"><option value="manual">手入力</option><option value="verified">メーカー確認済み条件</option></select><div id="verifiedArea" class="hide"><label>工具シリーズ</label><select id="series" onchange="buildDiameters()"></select><div id="hgsMatArea" class="hide"><label>高硬度材 / 硬度</label><select id="hgsMat" onchange="buildDiameters()"><option value="skd11">SKD11 55～62HRC</option><option value="hap10">HAP10 62～66HRC</option><option value="hap72">HAP72 66～70HRC</option></select></div><div id="ballMatArea" class="hide"><label>ボール加工の被削材</label><select id="ballMat" onchange="applyPreset()"></select></div><label id="presetLabel">工具径・刃長</label><select id="presetD" onchange="applyPreset()"></select></div><div id="sourceBox" class="source note"></div><div class="sec" style="margin-top:16px">基本条件</div><label>被削材</label><select id="mat" onchange="verifiedChanged()"><option value="steel">炭素鋼</option><option value="alloy">合金鋼</option><option value="sus">ステンレス</option><option value="al">アルミ</option><option value="copper">銅</option><option value="resin">樹脂</option><option value="castiron">鋳鉄</option><option value="hgs">高硬度材</option><option value="titanium">チタン</option><option value="tungsten">タングステン</option><option value="inconel">ニッケル基合金</option><option value="cwlb">ボール加工</option></select><label>加工</label><select id="op" onchange="verifiedChanged()"><option value="side">側面加工</option><option value="slot">溝加工</option><option value="finish">仕上げ加工</option></select><div class="grid"><div><label>工具径 D (mm)</label><input id="d" type="number" value="10" min="0.1" step="0.1"></div><div><label>刃数 Z</label><input id="z" type="number" value="3" min="1" step="1"></div><div><label>切削速度 Vc (m/min)</label><input id="vc" type="number" value="200" min="1"></div><div><label>1刃送り fz (mm/t)</label><input id="fz" type="number" value="0.05" min="0.001" step="0.001"></div><div><label>軸方向切込み <b>ap</b> (mm)<br><span class="note">工具を上下方向に削り込む深さ</span></label><input id="ap" type="number" value="5" min="0" step="0.1"></div><div><label>径方向切込み <b>ae</b> (mm)<br><span class="note">工具を横方向に削り込む幅</span></label><input id="ae" type="number" value="1" min="0" step="0.1"></div></div><div class="sec" style="margin-top:16px">機械・保持条件</div><div class="grid"><div><label>突出し量 (mm)</label><input id="stick" type="number" value="30" min="0" step="1"></div><div><label>最高回転数 (rpm)</label><input id="maxn" type="number" value="12000" min="100" step="100"></div><div><label>加工長さ (mm)</label><input id="len" type="number" value="50" min="0" step="1"></div></div><label>クーラント</label><select id="cool" onchange="calc()"><option>水溶性</option><option>油性</option><option>エアブロー</option><option>ドライ</option></select><button class="btn" onclick="calc()">条件を計算</button></div><div class="card"><div id="compareBox" class="compare hide"><div><b>メーカー回転数</b><strong id="makerN">---</strong><span class="note"> rpm</span><br><b>メーカー送り</b><strong id="makerF">---</strong><span class="note"> mm/min</span></div><div><b>実使用回転数</b><strong id="actualN">---</strong><span class="note"> rpm</span><br><b>実使用送り</b><strong id="actualF">---</strong><span class="note"> mm/min</span></div></div><div class="grid"><div class="out">回転数 N<div id="n" class="v">---</div><span class="note">rpm</span></div><div class="out">送り速度 F<div id="f" class="v">---</div><span class="note">mm/min</span></div><div class="out">実切削速度<div id="vactual" class="v">---</div><span class="note">m/min</span></div><div class="out">加工時間<div id="time" class="v">---</div><span class="note">秒・概算</span></div><div class="out">L/D<div id="ld" class="v">---</div><span class="note">突出し比</span></div><div class="out">ae/D<div id="ratio" class="v">---</div><span class="note">%</span></div><div class="out">ap/D<div id="apratio" class="v">---</div><span class="note">%</span></div><div class="out">除去量目安<div id="mrr" class="v">---</div><span class="note">cm³/min</span></div></div><div id="msg" class="note" style="margin-top:14px"></div></div><div class="card note"><b>EXTRA版 v0.9</b><br>CWBボール加工を被削材別メーカー確認済み条件に接続。R/刃長を選ぶとN・F・ap・aeを自動入力します。</div></main><script src="conditions.js"></script><script src="hgs-conditions.js"></script><script src="ball-conditions.js"></script><script>const $=id=>document.getElementById(id);let preset=null;document.querySelectorAll('input[type=number]').forEach(x=>{x.inputMode='decimal';x.addEventListener('focus',function(){this.select()})});function isHGS(){return $('mat').value==='hgs'}function isBall(){return $('mat').value==='cwlb'}function dbMat(){return (window.EXTRA_CONDITIONS?.materials||{})[$('mat').value]}function hideSpecial(){ $('hgsMatArea').classList.add('hide');$('ballMatArea').classList.add('hide') }function syncMode(){const verified=$('mode').value==='verified';$('verifiedArea').classList.toggle('hide',!verified);if(!verified){preset=null;hideSpecial();$('presetLabel').textContent='工具径・刃長';$('sourceBox').textContent='手入力モード：入力したVc・fz・ap・aeをそのまま計算します。';calc();return}if(isHGS()||isBall()){buildSeries();return}if(!dbMat()){hideSpecial();$('sourceBox').innerHTML='<span class="warn">この被削材のメーカー確認済み条件は未登録です。</span>';$('series').innerHTML='';$('presetD').innerHTML='';preset=null;calc();return}buildSeries()}function buildSeries(){if(isHGS()){const h=window.EXTRA_HGS_CONDITIONS;$('hgsMatArea').classList.remove('hide');$('ballMatArea').classList.add('hide');$('presetLabel').textContent='工具径・刃長';$('series').innerHTML=h?'<option value="HGS">HGS / HMGCOAT / 6枚刃</option>':'';buildDiameters();return}if(isBall()){const b=window.EXTRA_BALL_CONDITIONS;$('hgsMatArea').classList.add('hide');$('ballMatArea').classList.remove('hide');$('presetLabel').textContent='ボールR・工具径・刃長';$('ballMat').innerHTML=Object.entries(b?.materials||{}).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');const names=Object.keys(b?.series||{});$('series').innerHTML=names.map(x=>`<option value="${x}">${x} / ${b.series[x].coating} / ${b.series[x].flutes}枚刃</option>`).join('');buildDiameters();return}hideSpecial();$('presetLabel').textContent='工具径・刃長';const m=dbMat();if(!m)return;const names=Object.keys(m.series||{});$('series').innerHTML=names.map(x=>`<option value="${x}">${x}</option>`).join('');buildDiameters()}function buildDiameters(){if(isHGS()){const h=window.EXTRA_HGS_CONDITIONS,m=h?.materials?.[$('hgsMat').value],rows=m?.rows||[];$('presetD').innerHTML=rows.map((r,i)=>`<option value="${i}">φ${r.d} / 刃長 ${r.loc}mm</option>`).join('');applyPreset();return}if(isBall()){const b=window.EXTRA_BALL_CONDITIONS,s=b?.series?.[$('series').value],rows=s?.verifiedTools||[];$('presetD').innerHTML=rows.map((r,i)=>`<option value="${i}">R${r.r} / φ${r.d} / 刃長 ${r.loc}mm</option>`).join('');applyPreset();return}const m=dbMat(),s=m?.series?.[$('series').value];if(!s)return;$('presetD').innerHTML=s.rows.map(r=>`<option value="${r.d}">φ${r.d}</option>`).join('');applyPreset()}function applyPreset(){if($('mode').value!=='verified')return;if(isHGS()){const h=window.EXTRA_HGS_CONDITIONS,m=h?.materials?.[$('hgsMat').value],r=m?.rows?.[+$('presetD').value];if(!r)return;$('op').value='finish';$('d').value=r.d;$('z').value=h.flutes;$('vc').value=(Math.PI*r.d*r.n/1000).toFixed(1);$('fz').value=(r.f/(r.n*h.flutes)).toFixed(4);$('ap').value=r.ap;$('ae').value=r.ae;preset={n:r.n,f:r.f};$('sourceBox').innerHTML='<span class="good">● '+h.maker+' '+h.series+' / '+m.label+' / φ'+r.d+' / 刃長 '+r.loc+'mm</span><br>メーカー仕上げ条件: N '+r.n.toLocaleString()+' rpm / F '+r.f.toLocaleString()+' mm/min / ap '+r.ap+' mm / ae '+r.ae+' mm';calc();return}if(isBall()){const b=window.EXTRA_BALL_CONDITIONS,s=b?.series?.[$('series').value],r=s?.verifiedTools?.[+$('presetD').value],mk=$('ballMat').value,c=r?.cond?.[mk];if(!r||!c)return;$('op').value='finish';$('d').value=r.d;$('z').value=s.flutes;$('vc').value=(Math.PI*r.d*c.n/1000).toFixed(1);$('fz').value=(c.f/(c.n*s.flutes)).toFixed(4);$('ap').value=c.ap;$('ae').value=c.ae;preset={n:c.n,f:c.f};$('sourceBox').innerHTML='<span class="good">● '+b.maker+' '+$('series').value+' / '+b.materials[mk].label+' / R'+r.r+' / φ'+r.d+' / 刃長 '+r.loc+'mm</span><br>型番 '+r.model+' / メーカー条件: N '+c.n.toLocaleString()+' rpm / F '+c.f.toLocaleString()+' mm/min / ap '+c.ap+' mm / ae '+c.ae+' mm';calc();return}const m=dbMat(),s=m?.series?.[$('series').value],r=s?.rows?.find(x=>x.d===+$('presetD').value);if(!r)return;const kind=$('op').value;$('d').value=r.d;$('z').value=s.flutes;let F,AP,AE;if(kind==='slot'&&r.slotF!=null){F=r.slotF;AP=r.slotAp;AE=r.d}else{F=r.sideF;AP=r.sideAp;AE=r.sideAe}if(F==null){$('sourceBox').innerHTML='<span class="warn">この加工方法のメーカー確認済み条件は未登録です。</span>';preset=null;calc();return}preset={n:r.n,f:F};$('vc').value=(Math.PI*r.d*r.n/1000).toFixed(1);$('fz').value=(F/(r.n*s.flutes)).toFixed(4);$('ap').value=AP;$('ae').value=AE;$('sourceBox').innerHTML='<span class="good">● '+s.maker+' '+$('series').value+' / '+m.label+' / φ'+r.d+'</span><br>メーカー表: N '+r.n.toLocaleString()+' rpm / F '+F.toLocaleString()+' mm/min / ap '+AP+' mm'+(kind==='slot'?' / 溝加工':' / ae '+AE+' mm');calc()}function verifiedChanged(){if($('mode').value==='verified')syncMode();else calc()}function calc(){const D=+$('d').value,Z=+$('z').value,V=+$('vc').value,q=+$('fz').value,AP=+$('ap').value,AE=+$('ae').value,L=+$('stick').value,M=+$('maxn').value,LL=+$('len').value;if(!(D>0&&Z>0&&V>0&&q>0&&M>0&&AP>=0&&AE>=0&&L>=0&&LL>=0)){$('msg').innerHTML='<span class="bad">入力値を確認してください。</span>';return}const raw=1000*V/(Math.PI*D),N=Math.min(raw,M),F=q*Z*N,VA=Math.PI*D*N/1000,LD=L/D,R=AE/D*100,APR=AP/D*100,T=F>0?LL/F*60:0,MRR=AP*AE*F/1000;$('n').textContent=Math.round(N).toLocaleString();$('f').textContent=Math.round(F).toLocaleString();$('vactual').textContent=VA.toFixed(1);$('time').textContent=T.toFixed(1);$('ld').textContent=LD.toFixed(1);$('ratio').textContent=R.toFixed(1);$('apratio').textContent=APR.toFixed(1);$('mrr').textContent=MRR.toFixed(2);const verified=$('mode').value==='verified'&&preset;$('compareBox').classList.toggle('hide',!verified);if(verified){$('makerN').textContent=preset.n.toLocaleString();$('makerF').textContent=preset.f.toLocaleString();$('actualN').textContent=Math.round(N).toLocaleString();$('actualF').textContent=Math.round(F).toLocaleString()}let a=[];if(raw>M)a.push('<span class="warn">⚠ 回転数を '+Math.round(raw).toLocaleString()+' → '+M.toLocaleString()+' rpm に制限。fz維持のため送りも調整。</span>');if(LD>5)a.push('<span class="bad">⚠ L/D='+LD.toFixed(1)+'：突出し比が大きいです。</span>');else if(LD>3)a.push('<span class="warn">△ L/D='+LD.toFixed(1)+'：突出し量はやや長めです。</span>');if(AE>D)a.push('<span class="bad">⚠ 横方向切込みaeが工具径を超えています。</span>');if(isBall())a.push('<span class="warn">△ ボール工具の表示Dは刃径です。実効切削径は接触位置で変わるため、Vc表示は参考値です。</span>');if(!a.length)a.push('<span class="good">● 入力値の基本チェック：OK</span>');a.push('※ 除去量は ap×ae×F の幾何計算値です。');$('msg').innerHTML=a.join('<br>')}syncMode();calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>リール発掘検索</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Instagram Reel Finder</p>
      <h1>伸びているリールを発掘</h1>
      <p class="lead">初回設定なし・完全無料。候補リールを入力して、1投稿ごとの再生数 ÷ フォロワー数で判定します。</p>
    </header>

    <section class="panel">
      <h2>① 判定条件</h2>
      <div class="grid">
        <label>最低フォロワー
          <input id="minFollowers" type="number" min="0" value="10000">
        </label>
        <label>投稿数（未満）
          <input id="maxPostsExclusive" type="number" min="1" value="180">
        </label>
        <label>最低再生倍率
          <input id="minRatio" type="number" min="1" step="0.1" value="3">
        </label>
        <label>最大経過日数
          <input id="maxDays" type="number" min="1" value="14">
        </label>
        <label>優先日数
          <input id="bestDays" type="number" min="1" value="7">
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>② 候補リールを入力</h2>
          <p class="sub">候補1投稿につき1行です。</p>
        </div>
        <button id="addBtn" class="secondary">＋候補を追加</button>
      </div>

      <div id="inputList"></div>
      <button id="runBtn" class="primary">条件で判定する</button>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <h2>③ 条件に合った投稿</h2>
          <p id="summary" class="sub">判定後、候補投稿のURLをここに表示します。</p>
        </div>
        <span id="count" class="badge">0件</span>
      </div>

      <div class="sortbar">
        <button class="chip active" data-sort="best">7日以内優先</button>
        <button class="chip" data-sort="ratio">倍率順</button>
        <button class="chip" data-sort="newest">新しい順</button>
        <button id="exportBtn" class="chip">CSV保存</button>
      </div>

      <div id="results" class="results">
        <p class="empty">候補を入力して「条件で判定する」を押してください。</p>
      </div>
    </section>

    <template id="rowTemplate">
      <div class="candidate">
        <input class="url" type="url" placeholder="リール投稿URL（必須）">
        <input class="username" placeholder="@username（任意）">
        <input class="followers" type="number" placeholder="フォロワー数">
        <input class="posts" type="number" placeholder="投稿数">
        <input class="views" type="number" placeholder="この1投稿の再生数">
        <input class="date" type="date">
        <button class="remove" type="button">削除</button>
      </div>
    </template>
  </main>
  <script src="./app.js"></script>
</body>
</html>

name: Build Reel Finder Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "instagram-reel-auto-finder-android/**"
      - ".github/workflows/build-reel-auto-finder-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: instagram-reel-auto-finder-android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reel-auto-finder-debug-apk
          path: instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK or build error log
        if: always()
        shell: bash
        run: |
          mkdir -p downloads
          rm -f downloads/reel-auto-finder-debug.apk downloads/reel-auto-finder-build-error.txt

          if [ -f instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp instagram-reel-auto-finder-android/app/build/outputs/apk/debug/app-debug.apk downloads/reel-auto-finder-debug.apk
            BUILD_OK=1
          else
            cp instagram-reel-auto-finder-android/build.log downloads/reel-auto-finder-build-error.txt || echo "Build failed before log creation" > downloads/reel-auto-finder-build-error.txt
            BUILD_OK=0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads
          git commit -m "Update Android reel finder build [skip ci]" || true
          git push

          if [ "$BUILD_OK" != "1" ]; then
            exit 1
          fi

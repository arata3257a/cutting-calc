<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EXTRA 管理者リセット</title><style>body{margin:0;background:#17191c;color:#f2f2f2;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,420px);background:#23262b;border:1px solid #555;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0008}.logo{font-size:30px;font-weight:900;font-style:italic;letter-spacing:2px;margin-bottom:8px}.logo .x{color:#d4af37}.sub{color:#bfc3c8;font-size:14px;margin-bottom:22px}.msg{font-size:14px;line-height:1.7;color:#d4d7da;background:#1b1d21;border:1px solid #3f4349;border-radius:10px;padding:14px}.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#171717;font-weight:900;font-size:16px}.done{margin-top:14px;color:#9fe3b1;font-weight:800}</style></head><body><main class="box"><div class="logo">E<span class="x">X</span>TRA</div><div class="sub">管理者用テストリセット</div><div class="msg">この端末に保存されている「利用済み」「アクセス認証」「インストール認証」の状態だけをリセットします。保存した加工条件データは削除しません。</div><button id="reset" class="btn">この端末をテスト用にリセット</button><div id="done" class="done" hidden>リセットしました。EXTRAへ戻ります…</div></main><script>(()=>{const keys=['extra-download-used-v1','extra-access-granted-v1'];document.getElementById('reset').onclick=()=>{try{keys.forEach(k=>localStorage.removeItem(k));sessionStorage.removeItem('extra-install-unlocked-v1')}catch{}document.getElementById('done').hidden=false;setTimeout(()=>location.replace('./access.html'),700)}})();</script></body></html>

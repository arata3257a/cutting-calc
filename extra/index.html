<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><title>加工条件かんたん計算 EXTRA</title><style>body{margin:0;background:#071525;color:#eef5ff;font-family:system-ui}.w{max-width:600px;margin:auto;padding:18px}.head{background:#102a43;border-bottom:4px solid #d4af37}.tag{display:inline-block;background:#d4af37;color:#071525;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:900}.card{background:#10243a;border:1px solid #29445f;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#b8c9da;font-size:13px;margin:11px 0 5px}select,input{width:100%;box-sizing:border-box;padding:12px;border:0;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out{background:#071b2d;border-radius:10px;padding:12px}.v{font-size:24px;font-weight:900;color:#ffd75e}.note{font-size:12px;color:#b8c9da}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#071525;font-weight:900;font-size:17px;margin-top:14px}</style></head><body><header class="head"><div class="w"><span class="tag">EXTRA</span><h1 style="margin:8px 0 2px">加工条件かんたん計算</h1><div class="note">実加工条件を詰める上位版</div></div></header><main class="w"><div class="card"><label>被削材</label><select id="mat"><option value="al">アルミ合金</option><option value="steel">炭素鋼</option><option value="sus">ステンレス</option><option value="copper">銅</option></select><label>加工</label><select id="op"><option value="side">側面加工</option><option value="slot">溝加工</option><option value="finish">仕上げ加工</option></select><div class="grid"><div><label>工具径 D (mm)</label><input id="d" type="number" value="10" min="0.1" step="0.1"></div><div><label>刃数 Z</label><input id="z" type="number" value="3" min="1" step="1"></div><div><label>切削速度 Vc (m/min)</label><input id="vc" type="number" value="200" min="1"></div><div><label>1刃送り fz (mm/t)</label><input id="fz" type="number" value="0.05" min="0.001" step="0.001"></div><div><label>ap (mm)</label><input id="ap" type="number" value="5" min="0" step="0.1"></div><div><label>ae (mm)</label><input id="ae" type="number" value="1" min="0" step="0.1"></div><div><label>突出し量 (mm)</label><input id="stick" type="number" value="30" min="0" step="1"></div><div><label>最高回転数 (rpm)</label><input id="maxn" type="number" value="12000" min="100" step="100"></div></div><label>クーラント</label><select id="cool"><option>水溶性</option><option>油性</option><option>エアブロー</option><option>ドライ</option></select><button class="btn" onclick="calc()">条件を計算</button></div><div class="card"><div class="grid"><div class="out">回転数 N<div id="n" class="v">---</div><span class="note">rpm</span></div><div class="out">送り速度 F<div id="f" class="v">---</div><span class="note">mm/min</span></div><div class="out">L/D<div id="ld" class="v">---</div><span class="note">突出し比</span></div><div class="out">切込み率 ae/D<div id="ratio" class="v">---</div><span class="note">%</span></div></div><div id="msg" class="note" style="margin-top:14px"></div></div><div class="card note">EXTRA版 v0.1。現在は基本計算エンジンを独立構築しています。材料別メーカー条件、突出し補正、荒/仕上げ補正、クーラント条件、安全判定を順次追加します。</div></main><script>function calc(){const D=+d.value,Z=+z.value,V=+vc.value,q=+fz.value,AP=+ap.value,AE=+ae.value,L=+stick.value,M=+maxn.value;if(!(D>0&&Z>0&&V>0&&q>0&&M>0)){msg.textContent='入力値を確認してください';return}const raw=Math.round(1000*V/(Math.PI*D)),N=Math.min(raw,M),F=Math.round(q*Z*N),LD=L/D,R=AE/D*100;n.textContent=N.toLocaleString();f.textContent=F.toLocaleString();ld.textContent=LD.toFixed(1);ratio.textContent=R.toFixed(1);let a=[];if(raw>M)a.push('機械の最高回転数に制限しました。');if(LD>4)a.push('突出し量が長めです。剛性低下に注意してください。');if(AE>D)a.push('aeが工具径を超えています。入力を確認してください。');if(AP<0)a.push('apを確認してください。');msg.textContent=a.length?a.join(' '):'基本条件の範囲チェック：OK';}calc();</script></body></html>

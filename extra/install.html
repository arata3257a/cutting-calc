<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30343a"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest-install.json?v=2"><title>EXTRA アプリインストール</title><style>body{margin:0;background:#17191c;color:#f2f2f2;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,420px);background:#23262b;border:1px solid #555;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0008}.logo{font-size:32px;font-weight:900;font-style:italic;letter-spacing:2px;margin-bottom:7px}.logo .x{color:#d4af37}.sub{color:#bfc3c8;font-size:14px;margin-bottom:22px}.ok{padding:12px;border:1px solid #8a6f22;background:#2d291d;border-radius:10px;color:#ffe28a;font-weight:800;margin-bottom:16px}.btn{width:100%;padding:15px;border:0;border-radius:10px;background:#d4af37;color:#171717;font-weight:900;font-size:16px}.btn:disabled{opacity:.55}.msg{margin-top:14px;font-size:13px;color:#c8c8c8;line-height:1.7}.back{display:block;text-align:center;color:#d7d7d7;margin-top:18px;text-decoration:none;font-size:13px}</style><script>(()=>{try{if(sessionStorage.getItem('extra-install-unlocked-v1')!=='1')location.replace('./')}catch{location.replace('./')}})();</script></head><body><main class="box"><div class="logo">E<span class="x">X</span>TRA</div><div class="sub">加工条件かんたん計算</div><div class="ok">✓ パスワード認証済み</div><button id="install" class="btn" disabled>インストール準備中...</button><div id="msg" class="msg">Chromeがアプリのインストール準備をしています。通常は数秒でボタンが有効になります。</div><a class="back" href="./">EXTRAへ戻る</a></main><script>(()=>{let deferred=null;const b=document.getElementById('install'),m=document.getElementById('msg');if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}if(standalone()){b.textContent='インストール済み';m.textContent='この端末にはEXTRAがインストールされています。';return}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;b.disabled=false;b.textContent='EXTRAをインストール';m.textContent='準備できました。下のボタンを押すと、Chromeのインストール確認が表示されます。'});b.onclick=async()=>{if(!deferred){m.textContent='まだ準備中です。数秒待ってください。表示されない場合はChromeでこのページを再読み込みしてください。';return}const p=deferred;deferred=null;try{await p.prompt();const r=await p.userChoice;if(r.outcome==='accepted')m.textContent='インストールを開始しました。';else{m.textContent='インストールはキャンセルされました。';b.disabled=false;b.textContent='EXTRAをインストール'}}catch{m.textContent='インストール確認を表示できませんでした。ページを再読み込みしてもう一度お試しください。'}};window.addEventListener('appinstalled',()=>{try{sessionStorage.removeItem('extra-install-unlocked-v1')}catch{}b.textContent='インストール完了';b.disabled=true;m.textContent='EXTRAのインストールが完了しました。'});setTimeout(()=>{if(!deferred&&!standalone()){b.disabled=false;b.textContent='インストールを確認';m.textContent='ボタンが有効にならない場合はChromeのメニューに「アプリをインストール」が表示されているか確認してください。'}},5000)})();</script></body></html>

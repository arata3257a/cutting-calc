<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>販売管理システム</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:#f5f7fb;color:#1f2937;display:grid;place-items:center;min-height:100vh}.box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;text-align:center;box-shadow:0 4px 18px #0001}.err{color:#b91c1c;font-size:13px;margin-top:10px}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div class="box"><b>販売管理システムを起動しています</b><div id="e" class="err"></div></div><script>(async()=>{try{const files=['v35_chunk_1.txt','v35_chunk_2.txt','v35_chunk_3.txt','v35_chunk_4.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=35b',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let text;if(typeof DecompressionStream!=='undefined'){try{const ds=new DecompressionStream('gzip');text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text()}catch(_){text=null}}if(!text){if(!window.pako)throw new Error('gzip decoder unavailable');text=new TextDecoder().decode(window.pako.ungzip(bin))}document.open();document.write(text);document.close()}catch(err){document.getElementById('e').textContent='起動に失敗しました。再読み込みしてください。';console.error(err)}})();</script></body></html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30343a"><title>EXTRA 更新中</title><style>body{margin:0;background:#30343a;color:#f3f3f3;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px}.tag{display:inline-block;background:#d4af37;color:#2b2d30;padding:5px 12px;border-radius:99px;font-weight:900}.msg{margin-top:14px;color:#d0d3d6}</style></head><body><div class="box"><span class="tag">EXTRA</span><div class="msg">最新版に更新しています…</div></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch(e){}location.replace('./?fresh='+Date.now())})();</script></body></html>

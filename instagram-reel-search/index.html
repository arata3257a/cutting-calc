<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>リール発掘検索</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Instagram Reel Finder</p>
      <h1>伸びているリールを発掘</h1>
      <p class="lead">1投稿ごとの再生数を、投稿者のフォロワー数と比較して判定します。</p>
    </header>

    <section class="panel">
      <h2>検索条件</h2>
      <div class="grid">
        <label>最低フォロワー
          <input id="minFollowers" type="number" min="0" value="10000">
        </label>
        <label>最大投稿数
          <input id="maxPosts" type="number" min="1" value="179">
        </label>
        <label>最低再生倍率
          <input id="minRatio" type="number" min="1" step="0.1" value="3">
        </label>
        <label>最大経過日数
          <input id="maxDays" type="number" min="1" value="14">
        </label>
        <label>優先日数
          <input id="bestDays" type="number" min="1" value="7">
        </label>
      </div>
      <button id="runBtn" class="primary">条件で絞り込む</button>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>候補データ</h2>
        <button id="addBtn" class="secondary">＋候補を追加</button>
      </div>
      <div id="inputList"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>検索結果</h2>
        <span id="count" class="badge">0件</span>
      </div>
      <div id="results" class="results">
        <p class="empty">条件に合う候補がここに表示されます。</p>
      </div>
    </section>

    <template id="rowTemplate">
      <div class="candidate">
        <input class="username" placeholder="@username">
        <input class="followers" type="number" placeholder="フォロワー">
        <input class="posts" type="number" placeholder="投稿数">
        <input class="views" type="number" placeholder="この1投稿の再生数">
        <input class="date" type="date">
        <input class="url" type="url" placeholder="リールURL">
        <button class="remove" type="button">削除</button>
      </div>
    </template>
  </main>
  <script src="./app.js"></script>
</body>
</html>

<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.json"><title>旋盤条件かんたん計算</title><style>body{font-family:system-ui;background:#071525;color:#eef5ff;margin:0}.w{max-width:560px;margin:auto;padding:18px}.h{background:#102a43;border-bottom:4px solid #d4af37}.card{background:#10243a;padding:16px;border-radius:14px;margin:14px 0}label{display:block;font-size:13px;margin:12px 0 5px;color:#b8c9da}select,input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:0;background:#fff;color:#111}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.b{background:#071b2d;padding:12px;border-radius:10px}.v{font-size:23px;font-weight:800;color:#ffd75e}.note{font-size:12px;color:#b8c9da}.ok{color:#9fe3b1}</style></head><body><header class="h"><div class="w"><b style="font-size:22px">旋盤条件かんたん計算</b><div class="note">初心者向け・メーカー公開条件基準</div></div></header><main class="w"><div class="card"><label>被削材</label><select id="mat"><option value="s45c">S45C / 中炭素鋼</option><option value="sus">SUS304 / SUS316</option><option value="al">アルミ合金（Si≦12%）</option></select><label>加工</label><select id="op"></select><label>加工径 D（mm）</label><input id="dia" type="number" min="1" step="1" value="20"><label>切削速度 Vc</label><select id="vc"></select></div><div class="card"><div class="g"><div class="b">回転数 N<div class="v" id="n">-</div><span class="note">min⁻¹</span></div><div class="b">切削速度 Vc<div class="v" id="vco">-</div><span class="note">m/min</span></div><div class="b">送り f<div class="v" id="feed">-</div><span class="note">mm/rev</span></div><div class="b">切込み ap<div class="v" id="ap">-</div><span class="note">mm</span></div></div></div><div class="card note"><span class="ok">● メーカー公開の標準切削条件を基準</span><br><span id="src"></span><br>初心者版は条件範囲の中央を参考スタート値として表示します。中央値はメーカー指定値ではなく、公開範囲からアプリが計算した値です。実加工ではインサート、ブレーカ、保持剛性、切削油、機械上限に合わせて調整してください。</div></main><script>
const data={s45c:{src:'タンガロイ T9200 / T9215（中炭素鋼・合金鋼）',ops:{finish:{name:'外径・仕上げ',vc:[150,400],f:[.1,.4],ap:[.3,1.5]},medium:{name:'外径・中切削',vc:[150,400],f:[.15,.5],ap:[.5,5.5]}}},sus:{src:'タンガロイ T6200/AH6200（オーステナイト系ステンレス）',ops:{finish:{name:'外径・仕上げ',vc:[90,200],f:[.08,.45],ap:[.5,2.5]},medium:{name:'外径・中切削',vc:[90,200],f:[.2,.5],ap:[1,4]}}},al:{src:'タンガロイ 非鉄金属加工用 / DX110・DX160 NS',ops:{finish:{name:'外径・仕上げ',vc:[300,2500],f:[.03,.3],ap:[.1,2]}}}};
function mid(a){return(a[0]+a[1])/2}function ops(){let m=data[mat.value];op.innerHTML=Object.entries(m.ops).map(([k,x])=>`<option value="${k}">${x.name}</option>`).join('');render()}function render(){let m=data[mat.value],d=m.ops[op.value];vc.innerHTML=`<option value="${mid(d.vc)}">標準中央 ${mid(d.vc)} m/min</option><option value="${d.vc[0]}">低め ${d.vc[0]} m/min</option><option value="${d.vc[1]}">高め ${d.vc[1]} m/min</option>`;src.textContent='基準：'+m.src;calc()}function calc(){let m=data[mat.value],d=m.ops[op.value],D=+dia.value,V=+vc.value;if(!d||D<=0)return;n.textContent=Math.round(1000*V/(Math.PI*D)).toLocaleString();vco.textContent=V;feed.textContent=mid(d.f).toFixed(3);ap.textContent=mid(d.ap).toFixed(2)}mat.onchange=ops;op.onchange=render;dia.oninput=calc;vc.onchange=calc;ops();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>

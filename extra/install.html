<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#30343a"><meta name="robots" content="noindex,nofollow"><title>EXTRA アプリインストール</title><style>body{margin:0;background:#17191c;color:#f2f2f2;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,420px);background:#23262b;border:1px solid #555;border-radius:18px;padding:24px;box-shadow:0 18px 50px #0008}.logo{font-size:34px;font-weight:900;font-style:italic;letter-spacing:2px;margin-bottom:7px}.logo .x{color:#d4af37}.sub{color:#bfc3c8;font-size:14px;margin-bottom:22px}.lead{font-size:14px;line-height:1.7;margin-bottom:14px}.input{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #666;background:#111317;color:#fff;font-size:20px;text-align:center;letter-spacing:5px}.btn{width:100%;margin-top:12px;padding:15px;border:0;border-radius:10px;background:#d4af37;color:#171717;font-weight:900;font-size:16px}.btn:disabled{opacity:.55}.msg{margin-top:14px;font-size:13px;color:#c8c8c8;line-height:1.7}.ok{padding:12px;border:1px solid #8a6f22;background:#2d291d;border-radius:10px;color:#ffe28a;font-weight:800;margin-bottom:16px}.hide{display:none}</style></head><body><main class="box"><div class="logo">E<span class="x">X</span>TRA</div><div class="sub">加工条件かんたん計算</div><section id="auth"><div class="lead">アプリをインストールするには、ダウンロードパスワードを入力してください。</div><input id="pw" class="input" type="password" inputmode="numeric" maxlength="8" placeholder="パスワード"><button id="unlock" class="btn">認証する</button><div id="authMsg" class="msg"></div></section><section id="ready" class="hide"><div class="ok">✓ パスワード認証済み</div><button id="install" class="btn" disabled>インストール準備中...</button><div id="msg" class="msg">Chromeがインストール準備をしています。</div></section></main><script>(()=>{const PASS='1984',A='extra-access-granted-v1';const auth=document.getElementById('auth'),ready=document.getElementById('ready'),pw=document.getElementById('pw'),authMsg=document.getElementById('authMsg'),b=document.getElementById('install'),m=document.getElementById('msg');let deferred=null;function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function addManifest(){if(document.querySelector('link[rel="manifest"]'))return;const l=document.createElement('link');l.rel='manifest';l.href='manifest-install.json?v=3';document.head.appendChild(l)}function authorize(){if(pw.value!==PASS){authMsg.textContent='パスワードが違います。';pw.value='';pw.focus();return}try{localStorage.setItem(A,'1')}catch{}auth.classList.add('hide');ready.classList.remove('hide');addManifest();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});if(standalone()){location.replace('./');return}m.textContent='準備中です。数秒お待ちください。'}document.getElementById('unlock').onclick=authorize;pw.addEventListener('keydown',e=>{if(e.key==='Enter')authorize()});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;b.disabled=false;b.textContent='EXTRAをインストール';m.textContent='準備できました。ボタンを押すとインストール確認が表示されます。'});b.onclick=async()=>{if(!deferred){m.textContent='Chromeのメニューに「アプリをインストール」が表示されているか確認してください。';return}const p=deferred;deferred=null;try{await p.prompt();const r=await p.userChoice;if(r.outcome==='accepted')m.textContent='インストールを開始しました。';else{m.textContent='インストールはキャンセルされました。';b.disabled=false;b.textContent='EXTRAをインストール'}}catch{m.textContent='インストール確認を表示できませんでした。ページを再読み込みしてください。'}};window.addEventListener('appinstalled',()=>{b.textContent='インストール完了';b.disabled=true;m.textContent='インストールが完了しました。ホーム画面からEXTRAを開いてください。'});setTimeout(()=>{if(!deferred&&!standalone()&&!ready.classList.contains('hide')){b.disabled=false;b.textContent='インストールを確認';m.textContent='ボタンが有効にならない場合はChromeのメニューから「アプリをインストール」を選んでください。'}},5000);if(standalone()){try{if(localStorage.getItem(A)==='1')location.replace('./')}catch{}}})();</script></body></html>

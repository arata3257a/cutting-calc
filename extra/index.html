<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071525"><link rel="manifest" href="manifest.json"><title>加工条件かんたん計算 EXTRA</title><style>body{margin:0;background:#071525;color:#eef5ff;font-family:system-ui}.w{max-width:620px;margin:auto;padding:18px}.head{background:#102a43;border-bottom:4px solid #d4af37}.tag{display:inline-block;background:#d4af37;color:#071525;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:900}.card{background:#10243a;border:1px solid #29445f;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#b8c9da;font-size:13px;margin:11px 0 5px}select,input{width:100%;box-sizing:border-box;padding:12px;border:0;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.out{background:#071b2d;border-radius:10px;padding:12px}.v{font-size:23px;font-weight:900;color:#ffd75e}.note{font-size:12px;color:#b8c9da}.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#d4af37;color:#071525;font-weight:900;font-size:17px;margin-top:14px}.warn{color:#ffd75e}.bad{color:#ff8f9d}.good{color:#9fe3b1}.sec{font-size:13px;font-weight:800;color:#dbe8f5;margin-top:4px}.source{background:#0b1e31;border:1px solid #29445f;border-radius:10px;padding:10px;margin-top:10px}.hide{display:none}@media(max-width:390px){.w{padding:12px}.grid{gap:8px}.v{font-size:21px}.out{padding:10px}}</style></head><body><header class="head"><div class="w"><span class="tag">EXTRA</span><h1 style="margin:8px 0 2px">加工条件かんたん計算</h1><div class="note">実加工条件を詰める上位版</div></div></header><main class="w"><div class="card"><div class="sec">条件入力方式</div><select id="mode" onchange="syncMode()"><option value="manual">手入力</option><option value="verified">メーカー確認済み条件</option></select><div id="verifiedArea" class="hide"><label>工具シリーズ</label><select id="series" onchange="buildDiameters()"></select><label>工具径</label><select id="presetD" onchange="applyPreset()"></select></div><div id="sourceBox" class="source note"></div><div class="sec" style="margin-top:16px">基本条件</div><label>被削材</label><select id="mat" onchange="verifiedChanged()"><option value="al">アルミ合金</option><option value="steel">炭素鋼</option><option value="sus">ステンレス</option><option value="copper">銅</option></select><label>加工</label><select id="op" onchange="verifiedChanged()"><option value="side">側面加工</option><option value="slot">溝加工</option><option value="finish">仕上げ加工</option></select><div class="grid"><div><label>工具径 D (mm)</label><input id="d" type="number" value="10" min="0.1" step="0.1"></div><div><label>刃数 Z</label><input id="z" type="number" value="3" min="1" step="1"></div><div><label>切削速度 Vc (m/min)</label><input id="vc" type="number" value="200" min="1"></div><div><label>1刃送り fz (mm/t)</label><input id="fz" type="number" value="0.05" min="0.001" step="0.001"></div><div><label>ap (mm)</label><input id="ap" type="number" value="5" min="0" step="0.1"></div><div><label>ae (mm)</label><input id="ae" type="number" value="1" min="0" step="0.1"></div></div><div class="sec" style="margin-top:16px">機械・保持条件</div><div class="grid"><div><label>突出し量 (mm)</label><input id="stick" type="number" value="30" min="0" step="1"></div><div><label>最高回転数 (rpm)</label><input id="maxn" type="number" value="12000" min="100" step="100"></div><div><label>加工長さ (mm)</label><input id="len" type="number" value="50" min="0" step="1"></div><div><label>主軸出力 (kW・任意)</label><input id="kw" type="number" value="" min="0" step="0.1" placeholder="未入力可"></div></div><label>クーラント</label><select id="cool" onchange="calc()"><option>水溶性</option><option>油性</option><option>エアブロー</option><option>ドライ</option></select><button class="btn" onclick="calc()">条件を計算</button></div><div class="card"><div class="grid"><div class="out">回転数 N<div id="n" class="v">---</div><span class="note">rpm</span></div><div class="out">送り速度 F<div id="f" class="v">---</div><span class="note">mm/min</span></div><div class="out">実切削速度<div id="vactual" class="v">---</div><span class="note">m/min</span></div><div class="out">加工時間<div id="time" class="v">---</div><span class="note">秒・概算</span></div><div class="out">L/D<div id="ld" class="v">---</div><span class="note">突出し比</span></div><div class="out">ae/D<div id="ratio" class="v">---</div><span class="note">%</span></div><div class="out">ap/D<div id="apratio" class="v">---</div><span class="note">%</span></div><div class="out">除去量目安<div id="mrr" class="v">---</div><span class="note">cm³/min</span></div></div><div id="msg" class="note" style="margin-top:14px"></div></div><div class="card note"><b>EXTRA版 v0.5</b><br>メーカー確認済み条件：UNION TOOL DLC-ALES（A5052/A7075）、CZS（S45C/S50C焼鈍材、SUS304）。SUS304×CZSはメーカー指定に合わせ、切削油条件をチェックします。</div></main><script src="conditions.js"></script><script>const $=id=>document.getElementById(id);function dbMat(){return (window.EXTRA_CONDITIONS?.materials||{})[$('mat').value]}function syncMode(){const verified=$('mode').value==='verified';$('verifiedArea').classList.toggle('hide',!verified);if(!verified){$('sourceBox').textContent='手入力モード：入力したVc・fz・ap・aeをそのまま計算します。';return}if(!dbMat()){$('sourceBox').innerHTML='<span class="warn">この被削材のメーカー確認済み条件は未登録です。</span>';$('series').innerHTML='';$('presetD').innerHTML='';return}buildSeries()}function buildSeries(){const m=dbMat();if(!m)return;const names=Object.keys(m.series||{});$('series').innerHTML=names.map(x=>`<option value="${x}">${x}</option>`).join('');buildDiameters()}function buildDiameters(){const m=dbMat(),s=m?.series?.[$('series').value];if(!s)return;$('presetD').innerHTML=s.rows.map(r=>`<option value="${r.d}">φ${r.d}</option>`).join('');applyPreset()}function applyPreset(){if($('mode').value!=='verified')return;const m=dbMat(),s=m?.series?.[$('series').value],r=s?.rows?.find(x=>x.d===+$('presetD').value);if(!r)return;const kind=$('op').value;$('d').value=r.d;$('z').value=s.flutes;let F,AP,AE;if(kind==='slot'){F=r.slotF;AP=r.slotAp;AE=r.d}else{F=r.sideF;AP=r.sideAp;AE=r.sideAe}const N=r.n;$('vc').value=(Math.PI*r.d*N/1000).toFixed(1);$('fz').value=(F/(N*s.flutes)).toFixed(4);$('ap').value=AP;$('ae').value=AE;$('sourceBox').innerHTML='<span class="good">● '+s.maker+' '+$('series').value+' / '+m.label+' / φ'+r.d+'</span><br>メーカー表: N '+N.toLocaleString()+' rpm / F '+F.toLocaleString()+' mm/min / ap '+AP+' mm'+(kind==='slot'?' / 溝加工':' / ae '+AE+' mm')+(s.coolantRequired?'<br><span class="warn">⚠ メーカー指定：切削油を使用してください。</span>':'');calc()}function verifiedChanged(){if($('mode').value==='verified'){if(!dbMat())syncMode();else buildSeries()}}function calc(){const D=+$('d').value,Z=+$('z').value,V=+$('vc').value,q=+$('fz').value,AP=+$('ap').value,AE=+$('ae').value,L=+$('stick').value,M=+$('maxn').value,LL=+$('len').value,K=$('kw').value===''?null:+$('kw').value;if(!(D>0&&Z>0&&V>0&&q>0&&M>0&&AP>=0&&AE>=0&&L>=0&&LL>=0)){$('msg').innerHTML='<span class="bad">入力値を確認してください。</span>';return}const raw=1000*V/(Math.PI*D),N=Math.min(raw,M),F=q*Z*N,VA=Math.PI*D*N/1000,LD=L/D,R=AE/D*100,APR=AP/D*100,T=F>0?LL/F*60:0,MRR=AP*AE*F/1000;$('n').textContent=Math.round(N).toLocaleString();$('f').textContent=Math.round(F).toLocaleString();$('vactual').textContent=VA.toFixed(1);$('time').textContent=T.toFixed(1);$('ld').textContent=LD.toFixed(1);$('ratio').textContent=R.toFixed(1);$('apratio').textContent=APR.toFixed(1);$('mrr').textContent=MRR.toFixed(2);let a=[];if(raw>M)a.push('<span class="warn">⚠ メーカー/計算回転数 '+Math.round(raw).toLocaleString()+' rpm は機械上限を超えるため '+M.toLocaleString()+' rpm に制限。</span>');if(LD>5)a.push('<span class="bad">⚠ L/D='+LD.toFixed(1)+'：突出し比が大きいです。工具剛性とびびりに注意。</span>');else if(LD>3)a.push('<span class="warn">△ L/D='+LD.toFixed(1)+'：突出し量はやや長めです。</span>');if(AE>D)a.push('<span class="bad">⚠ aeが工具径Dを超えています。</span>');if(AP>3*D)a.push('<span class="warn">△ apが3Dを超えています。工具刃長・突出し量を確認してください。</span>');const m=dbMat(),s=m?.series?.[$('series').value];if($('mode').value==='verified'&&s?.coolantRequired&&!['水溶性','油性'].includes($('cool').value))a.push('<span class="bad">⚠ SUS304×CZSのメーカー条件は切削油使用が必須です。水溶性または油性を選択してください。</span>');if(K!==null&&K<=0)a.push('<span class="bad">主軸出力は0より大きい値か未入力にしてください。</span>');if(!a.length)a.push('<span class="good">● 入力値の基本チェック：OK</span>');a.push('※ 除去量は ap×ae×F の幾何計算値です。必要動力や工具寿命の判定ではありません。');$('msg').innerHTML=a.join('<br>')}syncMode();calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');</script></body></html>
